async function playSession(fromIdx){
  const s = state.session;
  if (!s) return;
  if (state.playing){ stopAll(); return; }
  stopAll();
  state.playing = true;
  state.playMode = null;
  state.idx = fromIdx || 0;
  state.progress = 0;
  setPlaying(true);
  const from = fromIdx || 0;
  const useCloud = settings.ttsMode === 'cloud' && geminiKeyOk() && from === 0;
  if (useCloud){
    state.seekable = false;
    updatePlayer();
    setStatus('加载音频…');
    try {
      let blob = await DB.getAudio(s.id);
      if (!blob){
        setStatus('合成中…首次约需几秒，请稍候');
        blob = await synthCloudRetry(fullText(s), s.lang, () => setStatus('网络不稳，正在重试…'));
        await DB.putAudio(s.id, blob);
      }
      if (!state.playing || state.session !== s) return;
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      a.playbackRate = settings.rate;
      a.ontimeupdate = () => {
        const n = s.sentences.length;
        const ratio = a.duration ? a.currentTime / a.duration : 0;
        state.progress = ratio;
        state.idx = Math.min(n - 1, Math.floor(ratio * n));
        updatePlayer();
      };
      a.onended = () => { state.progress = 1; updatePlayer(); finishPlay(); };
      a.onerror = () => { fallbackSystem('音频播放失败'); };
      state.audioEl = a; state.audioUrl = url;
      await a.play();
      state.playMode = 'cloud';
      setStatus('云端语音 · 整篇播放中');
      updatePlayer();
      return;
    } catch (e){
      if (state.audioEl){ try { state.audioEl.pause(); } catch(_){} state.audioEl = null; }
      if (state.audioUrl){ URL.revokeObjectURL(state.audioUrl); state.audioUrl = null; }
      await fallbackSystem(e.kind === 'http' ? '云端音频 ' + e.status : '云端音频不可用');
      return;
    }
  }
  systemPlay(from);
}

async function fallbackSystem(reason){
  const s = state.session;
  if (!s) return;
  if (!voicesFor(s.lang).length){
    state.playing = false;
    setPlaying(false);
    updatePlayer();
    setStatus('这台设备没有 ' + LANGS[s.lang].native + ' 的系统语音');
    modal({
      title: '没有可用的朗读声音',
      body: '<p>这台设备上找不到 ' + esc(LANGS[s.lang].native) + ' 的系统语音。</p>'
        + '<p class="small">三条出路：<br>① 到设置里选一个已安装的「Natural / Online」音色<br>② 在系统里安装该语言语音包（' + esc(deviceInfo().voiceHint) + '）<br>③ 把朗读方式改成「云端音频」，需要填密钥。</p>',
      actions: [{ label: '去设置', primary: true, onClick: () => showView('settings') }]
    });
    return;
  }
  if (reason) toast(reason + '，已改用设备语音');
  systemPlay(0);
}

function systemPlay(from){
  const s = state.session;
  if (!s) return;
  if (!voicesFor(s.lang).length){ fallbackSystem(null); return; }
  const n = s.sentences.length;
  const start = Math.max(0, Math.min(n - 1, from || 0));
  state.playMode = 'system';
  state.seekable = true;
  state.playing = true;
  state.idx = start;
  state.progress = start / n;
  setPlaying(true);
  const v = pickVoice(s.lang);
  setStatus('设备语音 · ' + (v ? v.name : LANGS[s.lang].native));
  updatePlayer();
  speakSentences(s.sentences.slice(start), s.lang, settings.rate,
    i => {
      state.idx = start + i;
      state.progress = (state.idx + 0.5) / n;
      setPlaying(true);
      updatePlayer();
    },
    () => {
      state.playing = false;
      finishPlay();
    });
}

function finishPlay(){
  const s = state.session;
  state.playing = false;
  setPlaying(false);
  if (s) s.done.listen = true;
  if (!state.unlocked){ unlockSession(false); return; }
  state.idx = -1;
  state.progress = 0;
  setStatus('播放完毕');
  updatePlayer();
  saveSession();
}

function unlockSession(bySkip){
  const s = state.session;
  if (!s || state.unlocked) return;
  state.unlocked = true;
  s.done.listen = true;
  stopAll();
  saveSession();
  renderSession();
  toast(bySkip ? '已跳过第一遍，往下滑吧' : '第一遍听完了，往下滑吧');
}

function jump(delta){
  if (!state.seekable || !state.session) return;
  const n = state.session.sentences.length;
  const base = state.idx >= 0 ? state.idx : 0;
  jumpTo(base + delta);
}
function jumpTo(i){
  const s = state.session;
  if (!s || !state.seekable) return;
  const n = s.sentences.length;
  const idx = Math.max(0, Math.min(n - 1, i));
  state.playing = false;
  stopSpeech();
  systemPlay(idx);
}

function highlight(text, s){
  let out = esc(text);
  const surfaces = Array.from(new Set(s.words.map(w => w.surface).filter(Boolean))).sort((a, b) => b.length - a.length);
  surfaces.forEach(sf => {
    if (!text.includes(sf)) return;
    const e = esc(sf);
    out = out.split(e).join('<mark>' + e + '</mark>');
  });
  return out;
}

async function playReadAll(startAt){
  const s = state.session;
  stopAll();
  state.playingMode = 'read';
  const n = s.sentences.length;
  const from = Math.max(0, Math.min(n - 1, startAt || 0));
  state.readIdx = from;
  const st = $('#readStatus');
  const btn = $('#playRead'); if (btn) btn.textContent = '❚❚';
  const done = () => {
    state.playingMode = null;
    state.readIdx = -1;
    setCur(-1);
    if (btn) btn.textContent = '▶';
    if (st) st.textContent = '点句子可单独重读';
  };
  if (settings.ttsMode === 'cloud' && geminiKeyOk() && from === 0){
    if (st) st.textContent = '加载音频…';
    try {
      let blob = await DB.getAudio(s.id);
      if (!blob){
        if (st) st.textContent = '合成中…首次约需几秒，请稍候';
        blob = await synthCloudRetry(fullText(s), s.lang, () => { if (st) st.textContent = '网络不稳，正在重试…'; });
        await DB.putAudio(s.id, blob);
      }
      if (state.playingMode !== 'read' || state.session !== s) return;
      const url = URL.createObjectURL(blob);
      const a = new Audio(url); a.playbackRate = settings.rateRead;
      a.ontimeupdate = () => {
        const ratio = a.duration ? a.currentTime / a.duration : 0;
        const idx = Math.min(n - 1, Math.floor(ratio * n));
        state.readIdx = idx;
        setCur(idx);
      };
      a.onended = done;
      a.onerror = () => { done(); toast('云端音频播放失败，可改用系统语音'); };
      state.audioEl = a; state.audioUrl = url;
      await a.play();
      if (st) st.textContent = '云端语音播放中';
      return;
    } catch (e){
      if (state.audioEl){ try { state.audioEl.pause(); } catch(_){} state.audioEl = null; }
      if (state.audioUrl){ URL.revokeObjectURL(state.audioUrl); state.audioUrl = null; }
      if (state.playingMode !== 'read' || state.session !== s) return;
      if (st) st.textContent = '云端不可用，改用设备语音';
    }
  }
  speakSentences(s.sentences.slice(from), s.lang, settings.rateRead,
    (i) => { state.readIdx = from + i; setCur(from + i); },
    done);
}

function spotLangCap(lang){
  const arr = settings.spotMaxByLang || {};
  const n = Number(arr[lang]);
  if (n > 0) return Math.floor(n);
  return Math.max(1, Number(settings.spotTotal) || 10);
}

function pickSpotWords(words, onlyLang){
  const seen = new Set(), pools = {};
  (words || []).forEach(w => {
    if (!w || !w.term) return;
    if (onlyLang && w.lang && w.lang !== onlyLang) return;
    const k = (w.lang || '') + '|' + bare(w.term);
    if (seen.has(k)) return;
    seen.add(k);
    const l = w.lang || '';
    if (!pools[l]) pools[l] = [];
    pools[l].push(w);
  });
  const total = Math.max(1, Number(settings.spotTotal) || 10);
  const langs = Object.keys(pools);
  const shuffled = {}, idx = {}, caps = {};
  langs.forEach(l => {
    const arr = pools[l].slice();
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    shuffled[l] = arr; idx[l] = 0;
    caps[l] = Math.min(arr.length, spotLangCap(l));
  });
  const picks = [];
  let added = true;
  while (picks.length < total && added){
    added = false;
    langs.forEach(l => {
      if (picks.length >= total) return;
      if (idx[l] < caps[l]){ picks.push(shuffled[l][idx[l]++]); added = true; }
    });
  }
  return picks;
}

      + '</div>'

      +   '<button class="btn small" id="spotGood">都记住了 ✓</button>'
      +   '<button class="btn small" id="spotBad">有没记住的</button>'
      + '</div>',
    actions: [

async function aiCheer(words, langKey){
  const sameLang = (words || []).filter(w => w && w.term && (!langKey || w.lang === langKey));
  const list = sameLang.slice(0, 12).map(w => w.term).join('、');
  const langName = langKey && LANGS[langKey] ? LANGS[langKey].name : '中文';
  const prompt = '今天复习的是' + langName + '词：' + list + '。请只用' + langName + '写一句不超过 30 个词的鼓励语，自然用上其中至少 1 个词。'
    + '整句只能出现' + langName + '，不要混入任何其他语言的单词、中文解释、引号、换行或说明，只输出这句话。';
  const cand = await callGemini([{ text: prompt }], { temperature: 0.9, maxOutputTokens: 120 }, { retry: false });
  const txt = (cand.content.parts || []).map(p => p.text || '').join('').trim();
  return txt ? txt.replace(/^["“”„「」]+|["“”„「」]+$/g, '').slice(0, 80) : '';
}
function cheerIsMixed(txt, langKey, all){
  if (!txt) return false;
  if (langKey !== 'ja' && /[\u3040-\u30ff\u4e00-\u9fff]/.test(txt)) return true;
  if (langKey === 'en' && /[äöüß]/i.test(txt)) return true;
  const other = new Set((all || []).filter(w => w.lang && w.lang !== langKey && w.term)
    .map(w => bare(w.term).toLowerCase()).filter(Boolean));
  if (!other.size) return false;
  const tokens = txt.toLowerCase().match(/[\p{L}\p{M}]+/gu) || [];
  return tokens.some(t => other.has(t));
}

const listState = { filter: '', lang: '', sel: new Set(), selecting: false, calRange: 'day', calDate: '', calMonth: '' };

function parseDay(s){ const p = String(s || '').split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function fmtDay(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function shiftDay(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function dueGapFor(s, date){
  const d = dayDiff(s.date, date || todayStr());
  return (REVIEW_GAPS.indexOf(d) >= 0 && (s.reviewed || []).indexOf(d) < 0) ? d : null;
}
function listRange(){
  if (!listState.calDate) return null;
  const d = parseDay(listState.calDate);
  if (listState.calRange === 'week'){ const a = mondayOf(d); return [fmtDay(a), fmtDay(shiftDay(a, 6))]; }
  if (listState.calRange === 'month'){
    return [fmtDay(new Date(d.getFullYear(), d.getMonth(), 1)), fmtDay(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  }
  return [listState.calDate, listState.calDate];
}
const CAL_RANGE_NAMES = { day: '日', week: '周', month: '月' };
const YEAR_MIN = 2026, YEAR_MAX = 2126;

    dOpts.push('<option value="' + d + '"' + (d === vd ? ' selected' : '') + (dis ? ' disabled' : '') + '>' + pad2(d) + '</option>');

  return '<div class="datapick">'

  const d = Number(($('#pick-' + prefix + '-d') || {}).value);
  if (!y || !m || !d) return '';
  const last = new Date(y, m, 0).getDate();
  const v = y + '-' + pad2(m) + '-' + pad2(Math.min(d, last));
  const min = startDate();
  return v < min ? min : v;
}
function syncDatePick(prefix){
  const ys = $('#pick-' + prefix + '-y');
  const ms = $('#pick-' + prefix + '-m');
  const ds = $('#pick-' + prefix + '-d');
  if (!ys || !ms || !ds) return;
  const min = startDate();
  const my = Number(min.slice(0, 4)), mm = Number(min.slice(5, 7)), md = Number(min.slice(8, 10));
  const y = Number(ys.value), m = Number(ms.value);
  Array.from(ms.options).forEach(o => { o.disabled = y < my || (y === my && Number(o.value) < mm); });
  Array.from(ds.options).forEach(o => { o.disabled = y < my || (y === my && m < mm) || (y === my && m === mm && Number(o.value) < md); });
}
function bindDatePick(prefix){
  ['y', 'm'].forEach(p => {
    const el = $('#pick-' + prefix + '-' + p);
    if (el) el.addEventListener('change', () => syncDatePick(prefix));
  });
  syncDatePick(prefix);
}
function calRangeLabel(){
  const r = listRange();
  if (!r) return '不限日期';
  if (listState.calRange === 'month') return r[0].slice(0, 7);
  return r[0] === r[1] ? r[0] : r[0] + ' ~ ' + r[1];
}
function langWords(lang){
  const map = new Map();
  (state.history || []).filter(s => !lang || s.lang === lang).forEach(s => {
    (s.words || []).forEach(w => {
      if (!w || !bare(w.term)) return;
      const k = (s.lang || '') + '|' + bare(w.term);
      const rec = map.get(k) || { term: w.term, reading: w.reading || '', type: w.type || 'word', zh: w.zh || '', pos: w.pos || '', mark: '', lang: s.lang };
      if (!rec.zh && w.zh) rec.zh = w.zh;
      if (!rec.reading && w.reading) rec.reading = w.reading;
      if (w.type === 'phrase') rec.type = 'phrase';
      if (w.mark === 'miss') rec.mark = 'miss';
      else if (w.mark === 'fuzzy' && rec.mark !== 'miss') rec.mark = 'fuzzy';
      map.set(k, rec);
    });
  });
  return Array.from(map.values());
}

function calendarHtml(counts){
  const ym = listState.calMonth || todayStr().slice(0, 7);
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const today = todayStr();
  const minD = startDate();
  const minYm = minD.slice(0, 7);
  const r = listRange();
  const canPrev = fmtDay(new Date(y, m - 2, 1)).slice(0, 7) >= minYm;
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div class="calday empty"></div>';
  for (let d = 1; d <= days; d++){
    const ds = fmtDay(new Date(y, m - 1, d));
    const cnt = counts[ds] || 0;
    const inSel = ds === listState.calDate || (r && ds >= r[0] && ds <= r[1]);
    const cls = 'calday' + (cnt ? ' has' : '') + (ds === today ? ' today' : '') + (inSel ? ' sel' : '');
    cells += '<button class="' + cls + '" data-calday="' + ds + '"' + (ds < minD ? ' disabled' : '') + '>' + d + (cnt ? '<span class="cnt">' + cnt + '</span>' : '') + '</button>';
  }
  return ''
  + '<div class="card">'
  +   '<div class="calhead">'
  +     '<button class="btn small" data-calmove="-1"' + (canPrev ? '' : ' disabled') + '>‹</button>'
  +     '<span class="caltitle">' + y + ' 年 ' + m + ' 月</span>'
  +     '<button class="btn small" data-calmove="1">›</button>'
  +   '</div>'
  +   '<div class="pills" style="margin-bottom:8px">'
  +     ['day', 'week', 'month'].map(v => '<button class="pill mini' + (listState.calRange === v ? ' on' : '') + '" data-calrange="' + v + '">' + CAL_RANGE_NAMES[v] + '</button>').join('')
  +   '</div>'
  +   '<div class="calgrid">' + ['一','二','三','四','五','六','日'].map(w => '<div class="calwk">' + w + '</div>').join('') + cells + '</div>'
  +   '<div class="calbar">'
  +     '<span class="tiny" style="flex:1;min-width:130px">筛选：' + calRangeLabel() + '</span>'
  +     (listState.calDate ? '<button class="btn small" id="calClear">清除日期筛选</button>' : '')
  +   '</div>'
  +   '<label class="f" style="margin-top:12px">手动选择年月日（最早 ' + minD + '）</label>'
  +   datePickHtml('histDate', listState.calDate || todayStr(), minD)
  +   '<div class="row" style="margin-top:8px"><button class="btn small" id="histJump">跳到这一天</button></div>'
  +   '<p class="tiny" style="margin:8px 0 0">点某一天，按当前「日 / 周 / 月」范围筛选下面的记录；上方的统计和当日回听队列则只看这一个日期。</p>'
  + '</div>';
}

function vocabCardHtml(){
  const rows = Object.keys(LANGS).map(k => {

      + '<div class="nm">' + LANGS[k].native + '<small>' + cnt + ' 篇 · ' + ws.length + ' 个去重词' + (hard ? ' · ' + hard + ' 个标为不熟' : '') + '</small></div>'

function openVocab(lang){
  const all = langWords(lang);
  const vs = { q: '', hard: false, sort: 'az' };
  const body = '<p class="tiny" id="vocabCount"></p>'
    + '<div class="row" style="align-items:center;gap:8px;margin-bottom:8px">'
      + '<span aria-hidden="true">🔍</span>'
      + '<input type="text" id="vocabSearch" enterkeyhint="search" placeholder="按回车搜索外文 / 中文" style="flex:1;min-width:0">'
    + '</div>'
    + '<div class="row" style="margin-bottom:8px">'
      + '<div class="pills">'
        + '<button class="pill mini on" id="vocabAll">全部</button>'
        + '<button class="pill mini" id="vocabHard">只看不熟</button>'
      + '</div>'
      + '<select id="vocabSort" style="width:auto;padding:6px 8px;font-size:12px">'
        + '<option value="az">字母 A–Z</option>'
        + '<option value="za">字母 Z–A</option>'
        + '<option value="hard">不熟优先</option>'
      + '</select>'
    + '</div>'
    + '<div class="wlist" id="vocabList"></div>';
  const score = w => (w.mark === 'miss' ? 2 : w.mark === 'fuzzy' ? 1 : 0);
  const draw = () => {
    const q = vs.q.trim().toLowerCase();
    let arr = all.filter(w => {
      if (vs.hard && score(w) === 0) return false;
      return wordMatches(w, q);
    });
    if (vs.sort === 'za') arr.sort((a, b) => b.term.localeCompare(a.term));
    else if (vs.sort === 'hard') arr.sort((a, b) => score(b) - score(a) || a.term.localeCompare(b.term));
    else arr.sort((a, b) => a.term.localeCompare(b.term));
    const cnt = $('#vocabCount');
    if (cnt) cnt.textContent = arr.length + ' / ' + all.length + ' 个去重词' + (q ? ' · 搜索“' + vs.q.trim() + '”' : '') + (vs.hard ? ' · 只看不熟' : '');
    const list = $('#vocabList');
    if (!list) return;
    list.innerHTML = arr.length
      ? arr.map(w => '<div class="wrow"><div class="wterm">' + esc(w.term)
          + (w.reading && w.reading !== w.term ? '<small>读音：' + esc(w.reading) + '</small>' : '')
          + (w.mark === 'miss' ? ' <span class="tag">不熟</span>' : w.mark === 'fuzzy' ? ' <span class="tag">模糊</span>' : '')
          + '</div><div class="wbody">' + (w.type === 'phrase' ? '<span class="tag">短语</span> ' : '') + (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '') + esc(w.zh || '（无中文）') + '</div></div>').join('')
      : '<p class="tiny">没有符合条件的词。</p>';
  };
  modal({
    title: LANGS[lang].native + ' · 总词表',
    body,
    actions: [{ label: '好', primary: true }]
  });
  const inp = $('#vocabSearch');
  if (inp) inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    vs.q = inp.value;
    draw();
  });
  const va = $('#vocabAll');
  if (va) va.addEventListener('click', () => { vs.hard = false; va.classList.add('on'); const h = $('#vocabHard'); if (h) h.classList.remove('on'); draw(); });
  const vh = $('#vocabHard');
  if (vh) vh.addEventListener('click', () => { vs.hard = true; vh.classList.add('on'); if (va) va.classList.remove('on'); draw(); });
  const vso = $('#vocabSort');
  if (vso) vso.addEventListener('change', () => { vs.sort = vso.value; draw(); });
  draw();
}

function statsCardHtml(date){
  const target = date || todayStr();
  const allDone = (state.history || []).filter(s => s.done && s.done.read);
  const doneDays = new Set(allDone.map(s => s.date));
  let d = parseDay(target);
  if (!doneDays.has(fmtDay(d))) d = shiftDay(d, -1);
  let streak = 0;
  while (doneDays.has(fmtDay(d))){ streak++; d = shiftDay(d, -1); }
  const dayDone = allDone.filter(s => s.date === target);
  const langs = {};
  dayDone.forEach(s => { langs[s.lang] = (langs[s.lang] || 0) + 1; });
  const langRows = Object.keys(langs).length
    ? Object.keys(langs).sort().map(k => {
        const n = langs[k];
        const pct = Math.round(n / dayDone.length * 100);
        return '<div class="sbar"><span class="lbl">' + (LANGS[k] ? LANGS[k].native : k) + '</span>'
          + '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>'
          + '<span class="n">' + n + '</span></div>';
      }).join('')
    : '<p class="tiny">这一天还没有完成的记录。</p>';
  return ''
  + '<div class="card">'
  +   '<div class="row" style="justify-content:space-between">'
  +     '<h2 style="margin:0">学习统计</h2>'
  +     '<span class="tiny">' + (target === todayStr() ? '今天 · ' + target : '选中日期 · ' + target) + '</span>'
  +   '</div>'
  +   '<div class="statgrid">'
  +     '<div class="statbox"><b>' + streak + '</b><span>连续学习天数</span></div>'
  +     '<div class="statbox"><b>' + dayDone.length + '</b><span>当日完成篇数</span></div>'
  +     '<div class="statbox"><b>' + Object.keys(langs).length + '</b><span>涉及语种</span></div>'
  +   '</div>'
  +   '<h3>语种分布</h3>' + langRows
  + '</div>';
}

async function renderHistory(){
  const root = $('#view-history');
  root.innerHTML = '<div class="card"><div class="tiny">读取中…</div></div>';
  state.history = await DB.all();
  if (!listState.calMonth) listState.calMonth = todayStr().slice(0, 7);
  const targetDate = listState.calDate || todayStr();
  const duePrefix = targetDate === todayStr() ? '今天有 ' : targetDate + ' 有 ';
  const donePrefix = targetDate === todayStr() ? '今天的回听已完成' : targetDate + ' 的回听已完成';
  const due = dueSessions(state.history, targetDate);
  const reviewed = reviewedSessions(state.history, targetDate);
  const q = listState.filter.trim().toLowerCase();
  const range = listRange();
  const list = state.history.filter(s => {
    if (listState.lang && s.lang !== listState.lang) return false;
    if (range && (s.date < range[0] || s.date > range[1])) return false;
    if (!q) return true;
    if ((s.title || '').toLowerCase().includes(q)) return true;
    if ((s.sentences || []).some(x => x.text.toLowerCase().includes(q))) return true;
    return (s.words || []).some(w => (w.term || '').toLowerCase().includes(q) || (w.zh || '').includes(q));
  });
  const counts = {};
  state.history.forEach(s => { counts[s.date] = (counts[s.date] || 0) + 1; });

  const reviewedTitles = reviewed.slice(0, 10).map(d => esc(d.session.title)).join('、')
    + (reviewed.length > 10 ? ' 等 ' + reviewed.length + ' 篇' : '');
  const dueHtml = (due.length || reviewed.length)
    ? '<div class="banner">'
      + (due.length
        ? '<b>' + duePrefix + due.length + ' 篇该回听</b>'
        : '<b>' + donePrefix + '</b>')
      + (due.length ? '<div class="tiny" style="margin:4px 0 8px">不用重做，听一遍 60 秒就够。每日最多回听 7 篇。</div>' : '')
      + due.map(d => '<div class="row" style="margin-top:6px"><span class="small" style="flex:1">' + esc(d.session.title) + ' <span class="muted">· 第 ' + d.gap + ' 天</span></span><button class="btn small" data-review="' + d.session.id + '" data-reviewgap="' + d.gap + '">回听</button></div>').join('')
      + (reviewed.length ? '<div class="tiny" style="margin-top:8px;line-height:1.6">已回听：' + reviewedTitles + '</div>' : '')
      + '</div>'
    : '';

  const items = list.length
    ? list.map(s => {
        const sel = listState.sel.has(s.id);
        const gap = dueGapFor(s, targetDate);
        return '<div class="listitem">'
          + '<input type="checkbox" data-check="' + s.id + '"' + (sel ? ' checked' : '') + ' style="margin-top:4px">'
          + '<div class="meta">'
          +   '<div class="ttl">' + esc(s.title) + (s.demo ? ' <span class="tag">演示</span>' : '') + '</div>'
          +   '<div class="sub">' + s.date + ' · ' + LANGS[s.lang].native + (s.level ? ' · ' + esc(s.level) : '') + ' · ' + (s.words || []).length + ' 个词' + (s.done && s.done.read ? '' : ' · 未完成') + (gap != null ? ' · 待回听' : '') + (s.lastReviewedOn ? ' · 已回听 ' + s.lastReviewedOn : '') + '</div>'
          +   '<div class="sub" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc((s.sentences || []).map(x => x.text).join(' ').slice(0, 46)) + '…</div>'
          + '</div>'
          + '<div class="acts">'
          +   '<button class="btn small" data-listen="' + s.id + '">回听</button>'
          +   '<button class="btn small" data-open="' + s.id + '">打开</button>'
          +   '<button class="btn small ghost" data-clearaudio="' + s.id + '" title="删除这篇的朗读缓存">清音频</button>'
          + '</div>'
          + '</div>';
      }).join('')
    : '<p class="tiny">没有符合条件的记录。</p>';

  root.innerHTML = ''
  + dueHtml
  + calendarHtml(counts)
  + statsCardHtml(targetDate)
  + '<div class="card">'
  +   '<div class="row" style="justify-content:space-between">'
  +     '<h2 style="margin:0">历史记录</h2>'

  +   '</div>'
  +   '<div class="pills" style="margin:10px 0 4px">'
  +     '<button class="pill mini' + (listState.lang ? '' : ' on') + '" data-flang="">全部语种</button>'
  +     Object.keys(LANGS).map(k => '<button class="pill mini' + (listState.lang === k ? ' on' : '') + '" data-flang="' + k + '">' + LANGS[k].native + '</button>').join('')
  +   '</div>'
  +   '<input type="text" id="searchBox" enterkeyhint="search" placeholder="搜索标题、正文或单词（按回车）" style="margin:10px 0" value="' + esc(listState.filter) + '">'
  +   '<div class="row" style="justify-content:space-between;margin-bottom:6px">'
  +     '<button class="btn small" id="selAll">' + (listState.sel.size && listState.sel.size === list.length ? '取消全选' : '全选') + '</button>'
  +     '<button class="btn small danger" id="delSel"' + (listState.sel.size ? '' : ' disabled') + '>删除所选 (' + listState.sel.size + ')</button>'
  +   '</div>'
  +   '<div class="row" style="margin-bottom:6px">'
  +     '<button class="btn small danger" id="delRange"' + (list.length ? '' : ' disabled') + '>清空筛选范围（' + list.length + '）</button>'

  +   '</div>'
  +   '<div class="wlist">' + items + '</div>'
  + '</div>'
  + vocabCardHtml()
  + '<div class="card tight"><div class="tiny">数据存在于这台设备的浏览器里，换设备请到「设置 → 导出」。</div></div>';

  $$('#view-history [data-calmove]').forEach(b => b.addEventListener('click', () => {

  $$('#view-history [data-calrange]').forEach(b => b.addEventListener('click', () => {
    listState.calRange = b.dataset.calrange;
    renderHistory();
  }));
  $$('#view-history [data-calday]').forEach(b => b.addEventListener('click', () => {
    const ds = b.dataset.calday;
    listState.calDate = listState.calDate === ds ? '' : ds;
    listState.sel.clear();
    renderHistory();
  }));
  const cc = $('#calClear');
  if (cc) cc.addEventListener('click', () => {
    listState.calDate = '';
    listState.sel.clear();
    renderHistory();
  });
  const hj = $('#histJump');
  if (hj) hj.addEventListener('click', () => {
    const v = readPick('histDate');
    if (!v) return;
    listState.calDate = v;
    listState.calMonth = v.slice(0, 7);

    renderHistory();

  bindDatePick('histDate');

    renderHistory();

    listState.refocus = true;

  });

    if (listState.sel.size && listState.sel.size === list.length) listState.sel.clear();
    else list.forEach(s => listState.sel.add(s.id));
    renderHistory();
  });
  $('#delSel').addEventListener('click', () => {
    if (!listState.sel.size) return;
    const n = listState.sel.size;
    modal({
      title: '删除 ' + n + ' 条记录？',
      body: '<p>词表、短文和音频缓存会一起删除，不能恢复。建议先导出一份备份。</p>',
      actions: [{ label: '取消' }, { label: '删除', onClick: async () => { await DB.remove(Array.from(listState.sel)); listState.sel.clear(); renderHistory(); toast('已删除 ' + n + ' 条'); } }]
    });
  });
  const dr = $('#delRange');
  if (dr) dr.addEventListener('click', () => {
    const n = list.length;
    if (!n) return;
    const backup = list.slice();
    modal({
      title: '清空这 ' + n + ' 条记录？',
      body: '<p>会删除当前筛选范围内的学习记录和音频缓存，删除后可以点一次「撤销」恢复记录。</p>',
      actions: [{ label: '取消' }, { label: '清空', onClick: async () => {

          title: '已清空 ' + n + ' 条记录',

function openSession(s, step, opts){
  const o = opts || {};
  stopAll();
  enterSession(s, true, o.readOnly !== false);
  state.reviewGap = o.reviewGap == null ? null : o.reviewGap;
  state.step = 1;
  state.retellLevel = 0;
  showView('today');
  offerRegenerateIfBroken(s);
}

function offerRegenerateIfBroken(s){
  const issues = sentenceIssues((s && s.sentences) || [], s && s.lang);
  if (!issues.length) return;
  setTimeout(() => {
    modal({
      title: '这篇短文的句子不完整',
      body: '<p class="small">这篇的原文有些句子只写了句首，整篇朗读会听起来像提示词。</p>'
        + '<p class="tiny">问题：' + esc(issues.slice(0, 3).join('；')) + '</p>'
        + '<p class="small">' + (geminiKeyOk() ? '可以让 AI 按原来的词重写一篇完整短文，学习记录会保留在原来的日期。' : '重写需要 Google 密钥；也可以先只看译文，或到设置里配置密钥。') + '</p>',
      actions: geminiKeyOk()
        ? [{ label: '仅查看', ghost: true }, { label: '重新生成', primary: true, onClick: () => regenerateSession(s) }]
        : [{ label: '知道了', primary: true }]
    });
  }, 120);
}

async function regenerateSession(s){
  const words = ((s && s.words) || []).map(w => ({ term: w.term, zhHint: w.zh || '' })).filter(w => w.term).slice(0, 10);
  if (!words.length){ toast('这篇没有可用的词，无法重写'); return; }
  try {
    const fresh = await generateSession(words, s.level || 'auto', s.lang);
    fresh.id = s.id;
    fresh.date = s.date;
    fresh.createdAt = s.createdAt || Date.now();
    fresh.demo = s.demo;
    fresh.notes = s.notes || [];
    await DB.put(fresh);
    state.history = await DB.all();
    enterSession(fresh, true, false);
    state.reviewGap = null;
    state.step = 1;
    state.retellLevel = 0;
    renderToday();
    toast('已按原来的词重写这篇短文');
  } catch(e){
    showApiError(e, () => regenerateSession(s));
  }
}

function buildToc(scopeId){
  const root = $('#' + scopeId);
  if (!root) return;
  const items = [];
  Array.from(root.children).forEach((el, idx) => {
    if (!el.classList || !el.classList.contains('card')) return;
    const h = el.querySelector('h1,h2');
    if (!h) return;
    const id = scopeId + '-sec-' + idx;
    el.id = id;
    items.push({ id, label: h.textContent.trim() });
  });
  if (!items.length) return;
  const fab = document.createElement('button');
  fab.className = 'tocFab';
  fab.type = 'button';
  fab.textContent = '目录';
  const panel = document.createElement('aside');
  panel.className = 'tocPanel hide';
  panel.innerHTML = '<h4>本页目录</h4>'
    + items.map(it => '<a href="#' + it.id + '" data-toc="' + it.id + '">' + esc(it.label) + '</a>').join('');
  fab.addEventListener('click', () => panel.classList.toggle('hide'));
  panel.querySelectorAll('[data-toc]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const target = document.getElementById(a.dataset.toc);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    panel.classList.add('hide');
  }));
  root.appendChild(fab);
  root.appendChild(panel);
}

async function showVoiceReport(){
  refreshVoices();
  if (!voices.length && 'speechSynthesis' in window){
    await new Promise(resolve => {
      const timer = setTimeout(resolve, 800);
      window.speechSynthesis.addEventListener('voiceschanged', () => {
        clearTimeout(timer); refreshVoices(); resolve();
      }, { once: true });
    });
  }
  refreshVoices();
  const dev = deviceInfo();
  const googleVoices = voices.filter(v => /google/i.test(v.name || ''));
  const rows = Object.keys(LANGS).map(k => {
    const list = voicesFor(k);
    if (!list.length){
      return '<div class="voice-item"><span>' + LANGS[k].native + '（' + LANGS[k].tts + '）</span><span style="color:var(--danger)">没有可用音色</span></div>';
    }
    const best = pickVoice(k);
    return '<div class="voice-item"><span>' + LANGS[k].native + '（' + list.length + ' 个）</span>'
      + '<span class="muted" style="text-align:right;max-width:62%">自动选：' + esc(best ? best.name : '') + '</span></div>';
  }).join('');
  const missing = Object.keys(LANGS).filter(k => !voicesFor(k).length).map(k => LANGS[k].native);
  modal({
    title: '语音体检',
    body: '<p class="small">当前设备：<b>' + dev.name + '</b> · ' + dev.browser + '</p>'
      + '<p class="small">Google 音色：<b>' + (googleVoices.length ? '检测到 ' + googleVoices.length + ' 个' : '未检测到') + '</b>'
      + ' <span class="tiny muted">（网页只能看到音色列表，读不到已安装的语音包名称；安卓上未检测到也可能是列表还没加载完）</span></p>'
      + rows
      + (missing.length
        ? '<p class="small warnbox">缺 ' + missing.join('、') + '。安装路径：' + esc(dev.voiceHint) + '；或者改用云端音频。</p>'
        : '<p class="small muted">三种语言都有可用音色。带 Natural / Online 字样的通常最好听，可以在「音色」里手动指定。</p>')
      + (dev.storageHint ? '<p class="tiny">' + esc(dev.storageHint) + '</p>' : '')
      + '<p class="tiny">手机音色来自系统 TTS；安卓装了 Google 语音包通常最全。装完后回到这里点「刷新列表」。</p>',
    actions: [
      { label: '刷新列表', onClick: () => setTimeout(showVoiceReport, 0) },
      { label: '好', primary: true }
    ]
  });
}

async function exportData(){
  const sessions = await DB.all();
  const payload = { app: 'LearnWordsByTexts', version: 1, exportedAt: new Date().toISOString(), sessions };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'LearnWordsByTexts-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('已导出 ' + sessions.length + ' 条记录');
}

function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const f = input.files && input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(String(reader.result));
        const list = Array.isArray(data) ? data : (data.sessions || []);
        if (!list.length) throw new Error('没有记录');
        for (const s of list){ if (s && s.id) await DB.put(s); }
        state.history = await DB.all();
        listState.sel.clear();
        renderHistory(); renderSettings();
        toast('已导入 ' + list.length + ' 条记录');
      } catch (e){
        modal({ title: '导入失败', body: '<p>文件不是有效的备份，或者格式不对。</p><p class="tiny">' + esc(e.message) + '</p>', actions: [{ label: '好', primary: true }] });
      }
    };
    reader.readAsText(f);
  };
  input.click();
}

        + '<p class="small">德语名词只写原型就行，工具会补冠词和复数。日语写辞书形，并在斜杠后手动加假名：<code>安い/やすい</code>。</p>'
        + '<p class="tiny">随时可以在「帮助」里重看这份引导。</p>'

  ];
  const s = slides[i];

function bindNav(){
  $$('#nav button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
}

function syncHeaderH(){
  const h = document.querySelector('header');
  if (h) document.documentElement.style.setProperty('--headerH', h.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderH);

async function init(){
  syncHeaderH();
  loadSettings();
  applyTheme();
  const tb = $('#themeBtn');
  if (tb) tb.addEventListener('click', toggleTheme);
  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => { if (settings.theme === 'auto') applyTheme(); });
  }
  await DB.init();
  state.draft.lang = settings.lang;
  state.draft.level = settings.level;
  try {
    state.pool = await loadPool(settings.lang);
    state.pickedOld = pickOld(state.pool, []);
    state.history = await DB.all();
  } catch (e){}
  if (!settings.firstUse){
    const ds = (state.history || []).map(s => s.date).filter(Boolean).sort();
    settings.firstUse = ds[0] || todayStr();
    saveSettings();
  }
  bindNav();
  renderToday();
  if (!settings.onboarded) setTimeout(() => showOnboarding(0), 400);
}

document.addEventListener('visibilitychange', () => {
  // 云端音频要能在锁屏/切后台时继续播，所以只在没有音频播放时停掉系统语音
  if (document.hidden && !(state.audioEl && !state.audioEl.paused)) stopSpeech();
});

init();
</script>
