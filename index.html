<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F8FF">
<title>以文诵词</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F8FF; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --soft:#EEF4FF;
  --brand:#2563EB; --brand-ink:#1D4ED8; --brand-soft:#E6EEFF;
  --danger:#DC2626; --warn:#B45309; --warn-soft:#FEF3C7;
  --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(15,23,42,.06);
}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#121C2E; --ink:#E2E8F0; --muted:#94A3B8; --line:#1F2A3C; --soft:#18243A;
  --brand:#60A5FA; --brand-ink:#BFDBFE; --brand-soft:#122A4A;
  --danger:#F87171; --warn:#FBBF24; --warn-soft:#3A2A0A;
  --shadow:none;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}

header{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.hbar{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.2px;white-space:nowrap;color:var(--brand-ink)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
.themebtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none;
  transition:.15s;line-height:1
}
.themebtn:hover{border-color:var(--brand);background:var(--brand-soft)}
nav button{
  border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);
  font-size:14px;white-space:nowrap;transition:.15s
}
nav button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
nav button:hover{color:var(--ink)}

.wrap{max-width:780px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.tight{padding:14px}
h1{font-size:22px;line-height:1.35;margin:0 0 6px;letter-spacing:-.3px}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:15px;margin:18px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.6}
.tiny{font-size:12px;line-height:1.55;color:var(--muted)}
.hide{display:none!important}

label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--card)}
input[type=range]{accent-color:var(--brand)}
::placeholder{color:var(--muted);opacity:1}
textarea{resize:vertical;min-height:110px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;line-height:1.7}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:9px 14px;font-size:14px;font-weight:500;transition:.15s
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0B1220}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.lg{padding:13px 18px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)
}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.pill.mini{padding:4px 10px;font-size:12px}

.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}

.steps{display:flex;gap:6px;margin-bottom:14px}
.steps button{
  flex:1;border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:8px 4px;font-size:13px;color:var(--muted);text-align:center
}
.steps button.on{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft);font-weight:600}
.steps button.done{color:var(--ink)}

/* 会话页：吸顶播放器 / 进度条 / 遮罩 */
.player{
  position:sticky;top:var(--headerH,56px);z-index:20;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(28,25,23,.07)
}
:root[data-theme="dark"] .player{box-shadow:0 4px 16px rgba(0,0,0,.4)}
.player .pr{display:flex;align-items:center;gap:10px}
.player .pinfo{flex:1;min-width:0}
.player .ptitle{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{position:relative;height:8px;background:var(--soft);border-radius:999px;margin-top:7px;overflow:hidden}
.pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brand);border-radius:999px;transition:width .2s linear}
.ptick{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--card) 75%,transparent)}
.seekbtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:none
}
.seekbtn:disabled{opacity:.22;cursor:default}
.sesssec{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.sechead{display:flex;align-items:baseline;gap:8px}
.sechead h3{margin:0}
.secno{font-size:12px;color:var(--muted)}
.maskwrap{position:relative;border-radius:var(--r);margin-top:8px}
.masked{filter:blur(7px);pointer-events:none;user-select:none;max-height:360px;overflow:hidden}
.mask{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;text-align:center;padding:18px;border-radius:var(--r);
  background:color-mix(in srgb,var(--card) 64%,transparent)
}
.skipbtn{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px}

/* 记录板 */
.noteboard{margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.nb-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--soft)}
.nb-head .nb-title{flex:1;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.nb-head .nb-title small{color:var(--muted);font-weight:400;font-size:12px}
.nb-body{padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--card)}
.nb-block{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.nb-block:first-child{margin-top:0}
:root[data-theme="dark"] .nb-block{background:#fff;color:#111}
.nb-btools{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--soft);flex-wrap:wrap}
.nb-btools .spacer{flex:1}
.nb-mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.nb-mode button{border:0;background:var(--card);padding:5px 10px;font-size:12.5px;color:var(--muted)}
.nb-mode button.on{background:var(--brand);color:#fff}
.nb-tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:12.5px;display:inline-flex;align-items:center;gap:3px}
.nb-tbtn:disabled{opacity:.35}
.nb-text{width:100%;min-height:84px;border:0;outline:none;resize:vertical;padding:10px 12px;font-size:15px;line-height:1.7;background:#fff;color:#111;border-radius:0 0 var(--r) var(--r);font-family:inherit}
.nb-canvas{display:block;width:100%;height:180px;background:#fff;cursor:crosshair;touch-action:none;border-radius:0 0 var(--r) var(--r)}
.nb-canvas.eraser{cursor:cell}
.nb-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.nb-foot .tiny{color:var(--muted);flex:1;min-width:140px}
.nb-add{margin-top:10px}
.nb-del{border:0;background:none;color:var(--danger);font-size:12px;padding:4px 6px}

.playwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 18px}
.playbtn{
  width:88px;height:88px;border-radius:50%;border:0;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 6px 22px color-mix(in srgb,var(--brand) 30%,transparent);transition:transform .12s
}
:root[data-theme="dark"] .playbtn{color:#0B1220}
.playbtn:active{transform:scale(.95)}
.playbtn.small{width:44px;height:44px;font-size:16px;box-shadow:none}
.wave{display:flex;gap:3px;align-items:flex-end;height:26px}
.wave i{width:3px;background:var(--brand);border-radius:2px;opacity:.35;height:10px;transition:.2s}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
.wave i:nth-child(6){animation-delay:.05s}
@keyframes wv{0%,100%{height:6px;opacity:.35}50%{height:24px;opacity:1}}

.sent{
  padding:9px 12px;border-radius:var(--r);border:1px solid transparent;margin:3px 0;
  cursor:pointer;transition:.15s;line-height:1.75
}
.sent:hover{background:var(--soft)}
.sent.cur{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.sent .zh{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.art{font-size:17px;line-height:2}
.art mark{background:color-mix(in srgb,var(--brand) 22%,transparent);color:inherit;border-radius:4px;padding:1px 2px}

.hintline{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.hintline:last-child{border-bottom:0}
.hintnum{color:var(--muted);font-size:12px;min-width:18px;padding-top:2px}
.hintbody{flex:1;font-size:15px;line-height:1.7}
.blank{display:inline-block;min-width:52px;border-bottom:1.5px dotted var(--muted);margin:0 3px}
.kw{
  display:inline-block;font-size:13px;padding:2px 9px;margin:2px 3px 2px 0;border-radius:999px;
  background:var(--soft);border:1px solid var(--line)
}

.wchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.wchip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;
  transition:.15s;user-select:none
}
.wchip.fuzzy{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.wchip.miss{background:var(--soft);border-color:var(--muted);color:var(--muted);text-decoration:line-through}

.wlist{margin-top:6px}
.wrow{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.wrow:first-child{border-top:0}
.wterm{font-weight:600;font-size:15px;min-width:96px}
.wterm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.wbody{flex:1;font-size:13.5px;line-height:1.65}
.wbody .pos{color:var(--brand-ink);font-size:12px;margin-right:6px}
.wnote{margin-top:6px}
.wnoteBtn{border:0;background:none;color:var(--muted);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.wnoteArea{width:100%;margin-top:6px;font:inherit;font-size:13px;line-height:1.5;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;box-sizing:border-box}
.prow{display:flex;gap:8px;align-items:center;margin-top:6px}
.pterm,.pzh,.preading{flex:1;min-width:0;font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pzh{flex:.85}.preading{flex:.8}

.listitem{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.listitem:first-child{border-top:0}
.listitem .meta{flex:1;min-width:0}
.listitem .ttl{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .sub{font-size:12.5px;color:var(--muted)}
.listitem .acts{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.listitem .acts .btn{padding:5px 8px}
@media (max-width:520px){
  .listitem .acts{justify-content:flex-start}
}

.banner{
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);
  border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13.5px
}
.warnbox{background:var(--warn-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--warn);margin:10px 0}

/* 历史日历 / 分语种词表 */
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.caltitle{flex:1;text-align:center;font-weight:600;font-size:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwk{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.calday{
  position:relative;border:1px solid transparent;background:none;border-radius:8px;
  min-height:38px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;padding:3px 0
}
.calday.empty{visibility:hidden}
.calday.has{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.calday.today{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.calday.sel{background:var(--brand);color:#fff}
:root[data-theme="dark"] .calday.sel{color:#0B1220}
.calday .cnt{font-size:10px;line-height:1;opacity:.85}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.vrow .nm{flex:1;font-weight:600;font-size:14px}
.vrow .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.vrow .num{font-size:12.5px;color:var(--muted)}

/* 学习统计 / 日期选择 / 今日成就 */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.statbox{background:var(--soft);border-radius:var(--r);padding:10px 6px;text-align:center}
.statbox b{display:block;font-size:20px;line-height:1.25;color:var(--brand-ink)}
.statbox span{font-size:11.5px;color:var(--muted)}
.sbar{display:flex;align-items:center;gap:6px;margin-top:5px}
.sbar .lbl{width:46px;font-size:11px;color:var(--muted);flex:none}
.sbar .track{flex:1;height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.sbar .fill{height:100%;background:var(--brand);border-radius:999px}
.sbar .n{width:26px;text-align:right;font-size:11px;color:var(--muted);flex:none}
.datapick{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.datapick select{width:auto;min-width:64px;padding:7px 8px;font-size:13px}
.datapick span{font-size:12px;color:var(--muted)}
.flagbtn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:17px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:.15s
}
.flagbtn:not(:disabled):hover{border-color:var(--brand);background:var(--brand-soft)}
.flagbtn:disabled{opacity:.35;cursor:not-allowed}
.cheer{
  margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--brand-soft);
  color:var(--brand-ink);font-size:14px;line-height:1.65
}
.wnoteShow{color:var(--brand-ink)}

details{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0;background:var(--card)}
details summary{cursor:pointer;font-weight:500;font-size:14px}
details[open] summary{margin-bottom:8px}

.overlay{
  position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:fade .15s ease-out
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:16px;max-width:440px;width:100%;max-height:86vh;overflow:auto;
  padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)
}
.modal h3{margin:0 0 10px;font-size:18px}
.modal .mbody{font-size:14px;line-height:1.7;color:var(--ink)}
.modal .mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;gap:5px;justify-content:center;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:16px;border-radius:3px}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;
  animation:fade .18s;max-width:calc(100% - 32px);text-align:center
}

.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.voice-item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.voice-item:first-child{border-top:0}

.ph{color:var(--muted);font-style:italic}

@media (max-width:480px){
  .hbar{padding:9px 12px;gap:8px}
  .brand{font-size:14.5px}
  nav button{padding:6px 10px;font-size:13px}
  .wrap{padding:14px 12px 90px}
  .card{padding:15px}
  .wterm{min-width:78px}
  h1{font-size:20px}
}
.nb-resize{height:18px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;background:var(--soft);border-top:1px solid var(--line);color:var(--muted);font-size:11px;user-select:none;touch-action:none}
.nb-resize::before{content:"";width:34px;height:3px;border-radius:2px;background:var(--line)}
.nb-fs{position:fixed;inset:0;z-index:90;background:#fff;display:flex;flex-direction:column}
.nb-fsbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.nb-fsbar .spacer{flex:1}
.nb-fsbar .tiny{color:var(--muted)}
#nbFsCanvas{display:block;width:100%;flex:1;min-height:0;background:#fff;touch-action:none}
.tocFab{position:fixed;right:14px;bottom:18px;z-index:45;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer}
.tocPanel{position:fixed;right:14px;top:calc(var(--headerH,56px) + 14px);z-index:46;width:228px;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.tocPanel h4{margin:0 0 8px;font-size:13px;color:var(--muted)}
.tocPanel a{display:block;padding:7px 6px;border-radius:8px;font-size:13px;color:var(--ink);text-decoration:none}
.tocPanel a:hover{background:var(--soft)}
.card[id]{scroll-margin-top:calc(var(--headerH,56px) + 12px)}
@media (max-width:520px){.tocPanel{width:calc(100vw - 28px)}}
@media print{
  body *{visibility:hidden}
  .printarea,.printarea *{visibility:visible}
  .printarea{display:block;position:absolute;left:0;top:0;width:100%;padding:24px}
}

<script>
"use strict";

/* ============================ 基础工具 ============================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const LANGS = {
  en: { name: 'English', native: 'English', tts: 'en-US', dir: 'ltr' },
  de: { name: 'Deutsch', native: 'Deutsch', tts: 'de-DE', dir: 'ltr' },
  ja: { name: '日本語', native: '日本語', tts: 'ja-JP', dir: 'ltr' }
};
const LEVELS = ['auto','A1','A2','B1','B2','C1','C2'];

/* ============================ 设置 ============================ */
const SETTINGS_KEY = 'lwbt.settings.v1';
const DEFAULT_SETTINGS = {
  apiKey: '', model: 'gemini-3.5-flash-lite',
  lang: 'en', level: 'auto', newCount: 10, poolOn: true,
  ttsMode: 'cloud', rate: 0.95, rateRead: 0.95, voicePref: {},
  germanTipHidden: false, jaTipHidden: false, pipeTipHidden: false,
  theme: 'auto', reviewOff: false, reviewBaseline: '',
  spotMode: 'current', spotTotal: 10, spotMaxByLang: {},
  firstUse: '',
  onboarded: false, retellOnboarded: false, cloudWarned: false, tipsSeen: false
};
let settings = Object.assign({}, DEFAULT_SETTINGS);
function loadSettings(){
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) settings = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
  } catch(e){}
}
function saveSettings(){
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}
}

/* ---------- 主题 ---------- */
function effectiveTheme(){
  if (settings.theme === 'dark') return 'dark';
  if (settings.theme === 'light') return 'light';
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  const t = effectiveTheme();
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0B1220' : '#F4F8FF');
  const b = document.getElementById('themeBtn');
  if (b){
    b.textContent = t === 'dark' ? '☀️' : '🌙';
    b.title = t === 'dark' ? '切换到日间模式' : '切换夜间模式';
    b.setAttribute('aria-label', b.title);
  }
}
function toggleTheme(){
  settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
  saveSettings();
  applyTheme();
}

/* ============================ 数据层 ============================ */
const DB = {
  db: null, ok: false,
  async init(){
    try {
      this.db = await new Promise((res, rej) => {
        const req = indexedDB.open('lwbt', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
        req.onblocked = () => rej(new Error('blocked'));
      });
      this.ok = true;
    } catch(e){
      this.ok = false;
    }
  },
  _lsAll(){
    try { return JSON.parse(localStorage.getItem('lwbt.sessions.v1') || '[]'); } catch(e){ return []; }
  },
  _lsSave(arr){
    try { localStorage.setItem('lwbt.sessions.v1', JSON.stringify(arr)); } catch(e){}
  },
  async all(){
    if (!this.ok) return this._lsAll().sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
    return await new Promise((res, rej) => {
      const out = [];
      const tx = this.db.transaction('sessions', 'readonly');
      const rq = tx.objectStore('sessions').openCursor();
      rq.onsuccess = () => {
        const c = rq.result;
        if (c){ out.push(c.value); c.continue(); } else {
          out.sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
          res(out);
        }
      };
      rq.onerror = () => rej(rq.error);
    });
  },
  async put(session){
    session.createdAt = session.createdAt || Date.now();
    if (!this.ok){
      const arr = this._lsAll().filter(s => s.id !== session.id);
      arr.push(session); this._lsSave(arr); return;
    }
    await new Promise((res, rej) => {
      const tx = this.db.transaction('sessions', 'readwrite');
      tx.objectStore('sessions').put(session);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async remove(ids){
    const list = [].concat(ids);
    if (!this.ok){
      this._lsSave(this._lsAll().filter(s => !list.includes(s.id)));
      list.forEach(id => this.delAudio(id));
      return;
    }
    await new Promise((res, rej) => {
      const tx = this.db.transaction(['sessions','audio'], 'readwrite');
      list.forEach(id => { tx.objectStore('sessions').delete(id); tx.objectStore('audio').delete(id); });
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async putAudio(id, blob){
    if (!this.ok) return false;
    try {
      await new Promise((res, rej) => {
        const tx = this.db.transaction('audio', 'readwrite');
        tx.objectStore('audio').put(blob, id);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      return true;
    } catch(e){ return false; }
  },
  async getAudio(id){
    if (!this.ok) return null;
    return await new Promise((res) => {
      const tx = this.db.transaction('audio', 'readonly');
      const rq = tx.objectStore('audio').get(id);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  },
  async delAudio(id){
    if (!this.ok) return;
    try {
      const tx = this.db.transaction('audio', 'readwrite');
      tx.objectStore('audio').delete(id);
    } catch(e){}
  },
  async clearAudio(){
    if (!this.ok) return 0;
    let n = 0;
    await new Promise((res) => {
      const tx = this.db.transaction('audio', 'readwrite');
      const store = tx.objectStore('audio');
      const rq = store.openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c){ n++; c.delete(); c.continue(); } else res(); };
      rq.onerror = () => res();
    });
    return n;
  },
  async audioCount(){
    if (!this.ok) return 0;
    return (await this.audioStats()).count;
  },
  async audioStats(){
    if (!this.ok) return { count: 0, bytes: 0 };
    return await new Promise((res) => {
      let n = 0, bytes = 0;
      const rq = this.db.transaction('audio','readonly').objectStore('audio').openCursor();
      rq.onsuccess = () => {
        const c = rq.result;
        if (c){ n++; if (c.value && typeof c.value.size === 'number') bytes += c.value.size; c.continue(); } else res({ count: n, bytes });
      };
      rq.onerror = () => res({ count: n, bytes });
    });
  },
  async clearAudioFor(id){
    if (!this.ok || !id) return 0;
    if (!(await this.getAudio(id))) return 0;
    let n = 0;
    await new Promise((res) => {
      const tx = this.db.transaction('audio', 'readwrite');
      const rq = tx.objectStore('audio').delete(id);
      rq.onsuccess = () => { n = 1; res(); };
      rq.onerror = () => res();
    });
    return n;
  },
  async clearAudioBefore(cutoff){
    if (!this.ok || !cutoff) return 0;
    const ids = new Set();
    await new Promise((res) => {
      const rq = this.db.transaction('sessions','readonly').objectStore('sessions').openCursor();
      rq.onsuccess = () => {
        const c = rq.result;
        if (c){ const v = c.value; if (v && v.date && v.date < cutoff) ids.add(c.key); c.continue(); } else res();
      };
      rq.onerror = () => res();
    });
    if (!ids.size) return 0;
    let n = 0;
    await new Promise((res) => {
      const tx = this.db.transaction('audio','readwrite');
      const store = tx.objectStore('audio');
      const rq = store.openCursor();
      rq.onsuccess = () => {
        const c = rq.result;
        if (c){ if (ids.has(c.key)){ n++; c.delete(); } c.continue(); } else res();
      };
      rq.onerror = () => res();
      tx.oncomplete = () => res();
    });
    return n;
  },
  async reset(){
    if (this.ok){
      await new Promise((res) => {
        const tx = this.db.transaction(['sessions','audio'], 'readwrite');
        tx.objectStore('sessions').clear(); tx.objectStore('audio').clear();
        tx.oncomplete = res; tx.onerror = res;
      });
    }
    try { localStorage.removeItem('lwbt.sessions.v1'); } catch(e){}
  }
};

/* ============================ 弹窗 / 提示 ============================ */
function toast(msg, ms = 2200){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 320); }, ms);
}
function modal({ title, body, actions = [], onClose = null, dismissable = true }){
  const root = $('#modal-root');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'
    + '<h3>' + esc(title) + '</h3>'
    + '<div class="mbody">' + body + '</div>'
    + '<div class="mactions"></div>'
    + '</div>';
  const acts = $('.mactions', ov);
  const close = () => { ov.remove(); if (onClose) onClose(); };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.primary ? 'primary' : '') + (a.ghost ? ' ghost' : '');
    b.textContent = a.label;
    b.onclick = () => { if (a.onClick){ if (a.onClick(close) === false) return; } close(); };
    acts.appendChild(b);
  });
  if (dismissable) ov.addEventListener('click', e => { if (e.target === ov) close(); });
  root.appendChild(ov);
  return close;
}

/* ============================ 存储自检 ============================ */
const STORAGE_MODE = {
  get idb(){ return DB.ok; },
  get label(){ return DB.ok ? 'IndexedDB（推荐）' : 'localStorage（降级）'; }
};

/* ============================ 词表解析 ============================ */
const stripBullet = t => String(t || '').replace(/^\d+[.、)\]]\s*/, '').replace(/^[\-*•·]\s*/, '').trim();
const kanaNorm = s => String(s || '').replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).toLowerCase();
function parseJaTerm(raw){
  const src = String(raw || '').trim();
  if (settings.lang !== 'ja' || !src.includes('/')) return { term: src, reading: '' };
  const parts = src.split('/').map(s => s.trim()).filter(Boolean);
  if (parts.length !== 2) return { term: src, reading: '' };
  const kana = parts.find(p => /^[\u3040-\u30ffー]+$/.test(p));
  const kanji = parts.find(p => /[\u3400-\u9fff]/.test(p));
  return { term: kanji || parts[0], reading: kana || parts[1] };
}
// 规则：每行默认一条；空行忽略；分号永远分隔；没有「｜」时逗号/顿号才分隔；空格永远不拆词。
function parseWords(raw){
  const out = [];
  const push = (term, hint, reading) => {
    term = String(term || '').replace(/\s+/g, ' ').trim();
    if (!term || out.length >= 10) return;
    const ja = parseJaTerm(term);
    out.push({
      term: ja.term,
      reading: String(reading || ja.reading || '').trim(),
      zhHint: String(hint || '').replace(/\s+/g, ' ').trim(),
      type: /\s/.test(ja.term) ? 'phrase' : 'word'
    });
  };
  const lines = String(raw || '').split(/\r?\n/);
  for (const line of lines){
    const lineText = stripBullet(line.trim());
    if (!lineText) continue;
    const chunks = /[;；]/.test(lineText) ? lineText.split(/[;；]+/) : [lineText];
    for (const chunkRaw of chunks){
      const chunk = stripBullet(chunkRaw.trim());
      if (!chunk) continue;
      const parts = /[|｜]/.test(chunk) ? [chunk] : chunk.split(/[,，、]+/);
      for (const partRaw of parts){
        const part = stripBullet(partRaw.trim());
        if (!part) continue;
        let term = part, hint = '';
        const pipe = part.search(/[|｜]/);
        if (pipe >= 0){
          term = part.slice(0, pipe).trim();
          hint = part.slice(pipe + 1).trim();
        } else {
          const m = /[|｜]/.test(part) ? null : part.match(/^(.+)\s+([\u3400-\u9fff][\s\S]*)$/);
          if (m){ term = m[1].trim(); hint = m[2].trim(); }
        }
        if (term) push(term, hint);
      }
    }
  }
  return out.slice(0, 10);
}
const ARTICLES = /^(der|die|das|den|dem|des|le|la|les|el|los|las|il|lo|gli|un|une|uno|una)\s+/i;
function bare(term){ return String(term || '').replace(ARTICLES, '').trim().toLowerCase(); }
function wordMatches(w, q){
  q = String(q || '').trim().toLowerCase();
  if (!q) return true;
  const fields = [w.term, w.reading, w.surface, w.zh, w.pos, w.note, w.collocation, w.extra]
    .map(v => String(v || '').toLowerCase());
  if (fields.some(f => f.includes(q))) return true;
  return /[\u3040-\u30ff]/.test(q) && fields.some(f => kanaNorm(f).includes(kanaNorm(q)));
}

/* ============================ 生词池 ============================ */
async function loadPool(lang){
  const sessions = await DB.all();
  const map = new Map();
  sessions.forEach(s => {
    if (s.lang !== lang) return;
    (s.words || []).forEach(w => {
      if (w.mark !== 'miss' && w.mark !== 'fuzzy') return;
      const key = bare(w.term);
      const rec = map.get(key) || { term: w.term, zh: w.zh, pos: w.pos, extra: w.extra, score: 0, count: 0, last: s.date };
      rec.score += (w.mark === 'miss' ? 2 : 1);
      rec.count += 1;
      if (s.date > rec.last) rec.last = s.date;
      map.set(key, rec);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.score - a.score || b.last.localeCompare(a.last));
}

/* ============================ 复习队列 ============================ */
// 艾宾浩斯间隔 [1,2,4,7,15,30] 的累计天数：第 1/3/7/14/29/59 天回听
const REVIEW_GAPS = [1, 3, 7, 14, 29, 59];
const REVIEW_MAX = 7;
function dueSessions(sessions, date){
  if (settings.reviewOff) return [];
  const target = date || todayStr();
  const base = settings.reviewBaseline || '';
  const out = [];
  sessions.forEach(s => {
    if (base && s.date < base) return;
    const d = dayDiff(s.date, target);
    if (REVIEW_GAPS.includes(d) && (s.done && s.done.read) && !(s.reviewed || []).includes(d)){
      out.push({ session: s, gap: d });
    }
  });
  out.sort((a, b) => a.gap - b.gap || String(a.session.date).localeCompare(String(b.session.date)));
  return out.slice(0, REVIEW_MAX);
}
function reviewedSessions(sessions, date){
  if (settings.reviewOff) return [];
  const target = date || todayStr();
  const base = settings.reviewBaseline || '';
  const out = [];
  sessions.forEach(s => {
    if (base && s.date < base) return;
    if (!(s.done && s.done.read)) return;
    const d = dayDiff(s.date, target);
    if (REVIEW_GAPS.includes(d) && (s.reviewed || []).includes(d)) out.push({ session: s, gap: d });
  });
  out.sort((a, b) => a.gap - b.gap || String(a.session.date).localeCompare(String(b.session.date)));
  return out;
}

/* ============================ Prompt ============================ */
function buildPrompt(words, lang, level){
  const L = LANGS[lang];
  const n = Math.max(words.length, 1);
  const lenText = lang === 'ja'
    ? (n * 20) + '–' + (n * 30) + ' 个字符'
    : (n * 7) + '–' + (n * 10) + ' 个单词';
  const list = words.map(w => {
    const read = w.reading ? '（读音：' + w.reading + '）' : '';
    const type = w.type === 'phrase' ? '〔短语〕' : '';
    return '- ' + w.term + read + type + (w.zhHint ? '｜' + w.zhHint : '');
  }).join('\n');
  const rules = {
    en: '英语：自然、口语化的书面表达；句子简短；避免生僻词和抽象议论。',
    de: '德语：名词首字母必须大写；冠词、格、动词变位必须正确；A1–A2 每句不超过 12 个词；可分动词要正确拆分。',
    ja: '日语：A1–A2 使用「です・ます」体；使用常用汉字；句子自然，不要直译腔；每句不超过 40 个字符。'
  }[lang];
  return '你是一位专业的多语言教材作者。请用给定词汇写一篇连贯、自然、适合朗读和复述的短文。\n\n'
    + '语言：' + L.name + '\n'
    + '难度：' + (level === 'auto' ? '请你根据这批词汇的实际难度自行判断等级（A1–C2），并给出一句话理由' : level) + '\n'
    + '长度：' + lenText + '\n'
    + rules + '\n\n'
    + '要求：\n'
    + '1. 每个目标词至少出现一次，并自然融入语境，不要生硬堆砌。\n'
    + '2. 句子之间要有清楚的逻辑衔接（时间、因果、转折），整体是一个有画面感的小场景，便于听后复述。\n'
    + '3. 语法必须正确，母语者读起来自然。\n'
    + '4. 为每个句子提供：text（完整原文句子）、starter（该句开头的 3–4 个词）、keywords（该句的目标词或关键词）、verb（该句主要动词原形）。text 必须是有主语、谓语和必要成分的完整句子，并以句末标点结束；starter 只是句首提示，绝对不能代替 text，也不能只写句首片段。\n'
    + '5. words 中给出每个目标词：term（原型）、surface（它在文中实际出现的那个词形，没有变化就与原型相同）、pos（词性）、zh（中文）、extra（形态说明：英语给不规则复数/过去式；德语名词给冠词和复数、动词给三时、形容词给比较级最高级；日语给词性与活用）、sentence（所在句子的序号，从 0 开始）、collocation（固定搭配及其中文，没有则空字符串）。\n'
    + '6. 目标词一律优先使用它最常见、最基础的义项（例如 harp 首选名词「竖琴」，不要用动词「反复唠叨」）；只有当括号里的中文提示明确指向另一义项时才例外。\n'
    + '7. 若某个词在文中以固定搭配/习语出现（如 harp on、come across、take after），在 collocation 里写成「搭配 + 中文」，例如 "harp on（反复唠叨某事）"；不确定是否固定搭配就留空字符串，不要编造。\n'
    + '8. 短语目标：凡是带〔短语〕标记、或本身包含空格/固定搭配的目标，必须作为整体处理，type 填 "phrase"，term 写完整短语，绝不能拆成几个单词分别返回；短文必须自然使用这个完整短语。德语可分动词允许在文中拆开（如 nimmt … in Anspruch），但 term 仍写完整原形；日语固定搭配也整体处理。\n'
    + '9. 日语必须在 reading 字段给平假名读音：若目标写成「汉字/假名」或已给读音，term 用汉字部分、reading 用假名部分，不得自行改写；本身是假名则两者相同。其他语言 reading 留空字符串。\n\n'
    + '目标词：\n' + list + '\n\n'
    + '只输出一个 JSON 对象，不要 markdown 代码块，不要任何解释文字。格式：\n'
    + '{"level":"A2","levelReason":"一句话理由","title":"短标题","sentences":[{"text":"原文","zh":"中文翻译","starter":"句首3-4词","keywords":["词"],"verb":"动词"}],"words":[{"term":"原型或完整短语","surface":"文中词形","reading":"日语平假名，其他语言为空","type":"word 或 phrase","pos":"词性","zh":"中文","extra":"形态说明","collocation":"固定搭配及中文，没有则空字符串","sentence":0}]}';
}

/* ============================ AI 调用（Gemini） ============================ */
const API_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
function geminiKeyOk(){ return !!(settings.apiKey && settings.apiKey.trim().length > 10); }

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function fetchWithTimeout(url, opts, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 25000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(timer));
}

async function callGemini(parts, generationConfig, opts){
  if (!geminiKeyOk()) throw { kind: 'nokey' };
  const url = API_BASE + encodeURIComponent(settings.model) + ':generateContent?key=' + encodeURIComponent(settings.apiKey.trim());
  const body = JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: generationConfig || {} });
  const maxTry = (opts && opts.retry === false) ? 1 : 2;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxTry; attempt++){
    let res;
    try {
      res = await fetchWithTimeout(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }, 25000);
    } catch (e){
      const aborted = e && e.name === 'AbortError';
      lastErr = { kind: aborted ? 'timeout' : 'network', detail: aborted ? '25 秒内没有响应' : (e && e.message ? e.message : String(e)) };
      if (attempt < maxTry && !aborted){ await sleep(1500); continue; }
      throw lastErr;
    }
    if (!res.ok){
      let detail = '';
      try { detail = await res.text(); } catch (e){}
      lastErr = { kind: 'http', status: res.status, detail: String(detail).slice(0, 600) };
      if (res.status === 503 && attempt < maxTry){
        toast('Google 侧模型繁忙，4 秒后自动重试');
        await sleep(4000);
        continue;
      }
      throw lastErr;
    }
    const data = await res.json();
    const cand = data && data.candidates && data.candidates[0];
    if (!cand) throw { kind: 'empty', detail: JSON.stringify(data).slice(0, 400) };
    if (cand.finishReason === 'MAX_TOKENS') throw { kind: 'truncated' };
    return cand;
  }
  throw lastErr;
}

function extractJson(text){
  const s = String(text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw { kind: 'badjson' };
  try { return JSON.parse(s.slice(a, b + 1)); }
  catch (e){ throw { kind: 'badjson', detail: e.message }; }
}

function sentenceIssues(sentences, lang){
  const issues = [];
  const plain = t => String(t || '').replace(/\s+/g, ' ').trim().replace(/[.!?…。！？」』"”]+$/g, '').trim();
  (sentences || []).forEach((s, i) => {
    const text = String(s.text || '').trim();
    const starter = String(s.starter || '').trim();
    if (!text){ issues.push('第 ' + (i + 1) + ' 句为空'); return; }
    const endOk = lang === 'ja' ? /[。！？!?…」』]$/.test(text) : /[.!?…"”』]$/.test(text);
    if (!endOk){ issues.push('第 ' + (i + 1) + ' 句句末没有标点'); return; }
    if (starter && plain(text) === plain(starter)){ issues.push('第 ' + (i + 1) + ' 句只有句首'); return; }
    if (starter && plain(text).length <= plain(starter).length){ issues.push('第 ' + (i + 1) + ' 句比句首还短'); return; }
  });
  return issues;
}

async function requestSession(newWords, level, lang, repairDetail){
  const prompt = buildPrompt(newWords, lang, level)
    + (repairDetail
      ? '\n\n注意：上一次输出不合格：' + repairDetail + '。请重新输出完整 JSON。text 必须是完整句子并带句末标点，starter 只能单独放在 starter 字段，绝不能拿句首片段代替 text。'
      : '');
  const cand = await callGemini(
    [{ text: prompt }],
    { temperature: 0.85, responseMimeType: 'application/json', maxOutputTokens: 4096 }
  );
  const raw = (cand.content && cand.content.parts || []).map(p => p.text || '').join('');
  const json = extractJson(raw);
  const session = normalizeSession(json, newWords, lang, level);
  const issues = sentenceIssues(session.sentences, lang);
  if (issues.length) throw { kind: 'incomplete', detail: issues.slice(0, 3).join('；') };
  return session;
}

async function generateSession(newWords, level, lang){
  try {
    return await requestSession(newWords, level, lang, '');
  } catch(e){
    if (e && (e.kind === 'incomplete' || e.kind === 'truncated')){
      toast('这次句子不完整，正在自动重写一次…');
      return await requestSession(newWords, level, lang, e.detail || '句子不完整');
    }
    throw e;
  }
}

function normalizeSession(json, newWords, lang, level){
  const sentences = (json.sentences || []).map(s => ({
    text: String(s.text || '').trim(),
    zh: String(s.zh || '').trim(),
    starter: String(s.starter || '').trim(),
    keywords: Array.isArray(s.keywords) ? s.keywords.map(String) : [],
    verb: String(s.verb || '').trim()
  })).filter(s => s.text);
  if (!sentences.length) throw { kind: 'badjson', detail: '模型没有返回句子' };

  const words = (json.words || []).map(w => ({
    term: String(w.term || '').trim(),
    surface: String(w.surface || w.term || '').trim(),
    reading: String(w.reading || '').trim(),
    type: (w.type === 'phrase' || /\s/.test(String(w.term || '').trim())) ? 'phrase' : 'word',
    pos: String(w.pos || '').trim(),
    zh: String(w.zh || '').trim(),
    extra: String(w.extra || '').trim(),
    collocation: String(w.collocation || '').trim(),
    note: String(w.note || '').trim(),
    sentence: Math.max(0, Math.min(sentences.length - 1, Number(w.sentence) || 0)),
    mark: null, isNew: true
  })).filter(w => w.term);

  const normTerm = v => bare(v).replace(/\s+/g, ' ');
  newWords.forEach(nw => {
    const hit = words.find(w => normTerm(w.term) === normTerm(nw.term) || normTerm(w.surface) === normTerm(nw.term));
    if (hit){
      hit.isNew = true;
      if (nw.reading) hit.reading = nw.reading;
      if (nw.type === 'phrase') hit.type = 'phrase';
      if (!hit.zh && nw.zhHint) hit.zh = nw.zhHint;
    } else {
      words.push({
        term: nw.term, surface: nw.term, reading: nw.reading || '',
        type: nw.type === 'phrase' ? 'phrase' : 'word',
        pos: '', zh: nw.zhHint || '', extra: '', collocation: '',
        note: '', sentence: 0, mark: null, isNew: true
      });
    }
  });

  return {
    id: uid(),
    date: todayStr(),
    lang,
    level: String(json.level || (level === 'auto' ? '' : level) || ''),
    levelReason: String(json.levelReason || ''),
    title: String(json.title || 'Untitled').trim(),
    sentences, words,
    demo: false,
    done: { listen: false, retell: false, read: false },
    reviewed: [],
    createdAt: Date.now()
  };
}

/* ============================ 系统语音 ============================ */
let voices = [];
function refreshVoices(){
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function voicesFor(langKey){
  const pre = LANGS[langKey].tts.split('-')[0];
  return voices.filter(v => (v.lang || '').toLowerCase().replace('_','-').startsWith(pre));
}
const GOOD_VOICE = /natural|neural|online|premium|enhanced|wavenet|studio/i;
function voiceScore(v, langKey){
  let sc = 0;
  if (GOOD_VOICE.test(v.name || '')) sc += 100;
  if (v.localService === false) sc += 30;
  if (/google/i.test(v.name || '')) sc += 20;
  if ((v.lang || '').toLowerCase().replace('_', '-') === LANGS[langKey].tts.toLowerCase()) sc += 10;
  return sc;
}
function deviceInfo(){
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && Number(navigator.maxTouchPoints) > 1);
  const android = /Android/i.test(ua);
  const mac = !ios && /Macintosh|Mac OS X/i.test(ua);
  const win = /Windows/i.test(ua);
  const browser = /Edg\//.test(ua) ? 'Edge'
    : /Chrome\//.test(ua) && !/OPR\//.test(ua) ? 'Chrome'
    : /Firefox\//.test(ua) ? 'Firefox'
    : /Safari\//.test(ua) ? 'Safari' : '浏览器';
  const name = android ? 'Android 手机/平板' : ios ? 'iPhone / iPad' : mac ? 'macOS 电脑' : win ? 'Windows 电脑' : '其他设备';
  const voiceHint = android
    ? '设置 → 系统 → 语言和输入 → 文字转语音输出 → Google 语音服务 → 安装语音数据'
    : ios
      ? '设置 → 辅助功能 → 朗读内容 → 声音 → 下载语音'
      : mac
        ? '系统设置 → 辅助功能 → 朗读内容 → 系统声音 → 管理声音'
        : win
          ? '设置 → 时间和语言 → 语音 → 添加语音'
          : '在系统设置里找到「文字转语音 / 语音」并安装对应语言';
  const storageHint = ios ? 'iOS 的浏览器可能在长期不用后清理网站数据，建议定期导出备份。' : '';
  return { ios, android, mac, win, browser, name, voiceHint, storageHint };
}
function pickVoice(langKey){
  const list = voicesFor(langKey);
  if (!list.length) return null;
  const pref = settings.voicePref && settings.voicePref[langKey];
  if (pref){
    const hit = list.find(v => (v.voiceURI || v.name) === pref) || list.find(v => v.name === pref);
    if (hit) return hit;
  }
  return list.slice().sort((a, b) => voiceScore(b, langKey) - voiceScore(a, langKey))[0];
}

let speechToken = 0;
let activeUtterance = null;
let speechWatchdog = null;
let speakTimer = null;
function stopSpeech(){
  speechToken++;
  clearTimeout(speechWatchdog);
  clearTimeout(speakTimer);
  speechWatchdog = null;
  activeUtterance = null;
  if ('speechSynthesis' in window){ try { window.speechSynthesis.cancel(); } catch(e){} }
}
function speakSentences(sentences, langKey, rate, onIdx, onEnd){
  if (!('speechSynthesis' in window)){ toast('这台设备的浏览器不支持系统语音'); return; }
  stopSpeech();
  const my = speechToken;
  const lang = LANGS[langKey].tts;
  const r = Math.max(0.5, Math.min(1.5, Number(rate) || 1));
  const list = sentences.map(s => typeof s === 'string' ? s : s.text).filter(t => (t || '').trim());
  let i = 0;
  let ended = false;
  if (!list.length){ onEnd && onEnd(); return; }
  const finish = () => {
    if (ended) return;
    ended = true;
    clearTimeout(speechWatchdog);
    speechWatchdog = null;
    activeUtterance = null;
    if (my === speechToken && onEnd) onEnd();
  };
  const advance = () => {
    clearTimeout(speechWatchdog);
    speechWatchdog = null;
    activeUtterance = null;
    if (my !== speechToken || ended) return;
    i++;
    // Chrome 在 cancel() 之后立刻 speak() 会吞掉这一句，留出间隔让引擎复位
    speakTimer = setTimeout(step, 140);
  };
  const step = () => {
    if (my !== speechToken || ended) return;
    if (i >= list.length){ finish(); return; }
    const text = list[i];
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = r;
    const v = pickVoice(langKey); if (v) u.voice = v;
    let settled = false;
    const settle = () => { if (settled || my !== speechToken || ended) return; settled = true; advance(); };
    u.onstart = () => { if (my === speechToken && !ended && onIdx) onIdx(i); };
    u.onend = settle;
    u.onerror = (e) => {
      if (my !== speechToken) return;
      const err = (e && e.error) || '';
      if (err === 'canceled' || err === 'interrupted') return;
      settle();
    };
    activeUtterance = u;
    // 看门狗：部分浏览器短句的 onend 不触发，到时间强制进入下一句，避免「播完了还在播」
    clearTimeout(speechWatchdog);
    const ms = Math.max(2200, text.length * 160 / r) + 2500;
    speechWatchdog = setTimeout(() => { if (my === speechToken && !ended && activeUtterance === u) settle(); }, ms);
    try { window.speechSynthesis.resume(); } catch(e){}
    try { window.speechSynthesis.speak(u); } catch(e){ settle(); }
  };
  speakTimer = setTimeout(step, 90);
}

/* ============================ 云端音频（Gemini TTS） ============================ */
function b64ToBytes(b64){
  const bin = atob(b64);
  const len = bin.length;
  const out = new Uint8Array(len);
  for (let i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function wavFromPcm(pcm, sampleRate, channels, bits){
  const blockAlign = channels * bits / 8;
  const byteRate = sampleRate * blockAlign;
  const dataSize = pcm.length;
  const buf = new ArrayBuffer(44 + dataSize);
  const dv = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + dataSize, true); w(8, 'WAVE');
  w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, channels, true); dv.setUint32(24, sampleRate, true);
  dv.setUint32(28, byteRate, true); dv.setUint16(32, blockAlign, true); dv.setUint16(34, bits, true);
  w(36, 'data'); dv.setUint32(40, dataSize, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type: 'audio/wav' });
}

async function synthCloud(text, langKey){
  const model = 'gemini-2.5-flash-preview-tts';
  if (!geminiKeyOk()) throw { kind: 'nokey' };
  const promptText = 'Read the following ' + LANGS[langKey].name + ' text aloud, clearly and naturally, with a warm tone.\n\n' + text;
  let res;
  try {
    res = await fetchWithTimeout(API_BASE + model + ':generateContent?key=' + encodeURIComponent(settings.apiKey.trim()), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Kore' } } }
        }
      })
    }, 45000);
  } catch (e){ throw { kind: e && e.name === 'AbortError' ? 'timeout' : 'network', detail: e.message }; }
  if (!res.ok){
    let d = ''; try { d = await res.text(); } catch (e){}
    throw { kind: 'http', status: res.status, detail: String(d).slice(0, 400) };
  }
  const data = await res.json();
  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const inline = parts.map(p => p.inlineData).find(Boolean);
  if (!inline || !inline.data) throw { kind: 'badjson', detail: '没有返回音频数据' };
  const mime = inline.mimeType || 'audio/L16;rate=24000';
  const rateMatch = mime.match(/rate=(\d+)/);
  const rate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
  return wavFromPcm(b64ToBytes(inline.data), rate, 1, 16);
}
async function synthCloudRetry(text, langKey, onRetry){
  try {
    return await synthCloud(text, langKey);
  } catch(e){
    const retryable = e && (e.kind === 'network' || e.kind === 'timeout' || (e.kind === 'http' && (e.status >= 500 || e.status === 429)));
    if (!retryable) throw e;
    if (onRetry) onRetry();
    toast('网络不太稳，正在自动重试一次…');
    await new Promise(r => setTimeout(r, 900));
    return await synthCloud(text, langKey);
  }
}

function currentWords(){
  const rev = state.draft.review;
  if (rev && rev.length){
    return rev.map(w => ({
      term: String(w.term || '').trim(),
      reading: String(w.reading || '').trim(),
      type: w.type === 'phrase' ? 'phrase' : 'word',
      zhHint: String(w.zhHint || '').trim()
    })).filter(w => w.term).slice(0, 10);
  }
  return parseWords($('#wordInput') ? $('#wordInput').value : '');
}

function updateWordCount(){
  const ta = $('#wordInput');
  if (!ta) return;
  const n = parseWords(ta.value).length;
  const lines = String(ta.value).split(/\r?\n/).map(s => s.trim()).filter(Boolean).length;
  const el = $('#wordCount');
  if (el) el.textContent = n + ' / 10 条' + (lines > 10 ? '（只取前 10 条）' : '');
}

function clearWordInput(){
  const ta = $('#wordInput');
  if (!ta) return;
  ta.value = '';
  state.draft.words = '';
  updateWordCount();
}

function showInputTips(lang){
  const needDe = lang === 'de' && !settings.germanTipHidden;
  const needJa = lang === 'ja' && !settings.jaTipHidden;
  const needPipe = !settings.pipeTipHidden;
  if (!needDe && !needJa && !needPipe) return;
  let body = '';
  if (needDe){
    body += '<p><b>德语输入提醒</b></p>'
      + '<p class="small">只输入生词原型，不要夹杂词性（如 n. / v.）；可分动词原形不要加分隔符或标点。短语可整行输入，空格不会拆词。</p>'
      + '<label class="tiny" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="tipDeChk"> 以后不再显示这条德语提醒</label>';
  }
  if (needJa){
    body += (needDe ? '<div style="border-top:1px solid var(--line);margin:12px 0"></div>' : '')
      + '<p><b>日语：手动写汉字/假名</b></p>'
      + '<p class="small">请写成 <code>安い/やすい｜便宜的</code>：斜杠左边是汉字表记，右边是假名读音。程序不会自动转换，也不会猜你的读音。</p>'
      + '<p class="tiny muted">只有一个写法时也可以只写一个；短语同样整行输入。</p>'
      + '<label class="tiny" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="tipJaChk"> 以后不再显示这条日语提醒</label>';
  }
  if (needPipe){
    body += (needDe || needJa ? '<div style="border-top:1px solid var(--line);margin:12px 0"></div>' : '')
      + '<p><b>词条怎么写</b></p>'
      + '<p class="small">每行默认一条，空格不会拆词，所以固定短语可以整行写：<br><code>in Anspruch nehmen｜采取</code><br><code>安い/やすい｜便宜的</code></p>'
      + '<p class="small">分号 <code>；</code> 永远分隔；没有「｜」时，逗号或顿号才分隔：<code>apple, banana</code>。有「｜」时，逗号留在中文释义里。</p>'
      + '<label class="tiny" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="tipPipeChk"> 以后不再显示这条输入格式提示</label>';
  }
  modal({
    title: '输入小提示',
    body,
    actions: [{
      label: '知道了', primary: true,
      onClick: () => {
        if (needDe){
          const c = document.getElementById('tipDeChk');
          if (c && c.checked) settings.germanTipHidden = true;
        }
        if (needJa){
          const c = document.getElementById('tipJaChk');
          if (c && c.checked) settings.jaTipHidden = true;
        }
        if (needPipe){
          const c = document.getElementById('tipPipeChk');
          if (c && c.checked) settings.pipeTipHidden = true;
        }

      }

function renderPreview(){
  const box = $('#previewBox');
  if (!box) return;
  const list = state.draft.review;
  if (!list || !list.length){ box.innerHTML = ''; return; }
  if (state.draft.reviewCollapsed){
    box.innerHTML = '<div class="card tight" style="margin-top:10px">'
      + '<div class="row" style="justify-content:space-between;align-items:center">'
      +   '<div class="tiny">词表已收起（' + list.length + ' 个词）</div>'
      +   '<button class="btn small" id="pExpand">展开</button>'
      + '</div></div>';
    $('#pExpand').addEventListener('click', () => { state.draft.reviewCollapsed = false; renderPreview(); });
    return;
  }
  box.innerHTML = '<div class="card tight" style="margin-top:10px">'
    + '<div class="row" style="justify-content:space-between;align-items:center">'
    +   '<div class="tiny">识别到 ' + list.length + ' 条（词或短语，最多 10 条）</div>'
    +   '<button class="btn ghost small" id="pAdd">+ 添加一个</button>'
    + '</div>'
    + '<div class="plist">' + list.map((w, i) =>
        '<div class="prow">'
        + '<input class="pterm" data-pterm="' + i + '" value="' + esc(w.term) + '" placeholder="' + (w.type === 'phrase' ? '完整短语' : '外文词') + '">'
        + (state.draft.lang === 'ja' ? '<input class="preading" data-preading="' + i + '" value="' + esc(w.reading || '') + '" placeholder="假名读音">' : '')
        + '<input class="pzh" data-pzh="' + i + '" value="' + esc(w.zhHint) + '" placeholder="中文（可空）">'
        + '<button class="btn ghost small" data-pdel="' + i + '">删</button></div>'
      ).join('') + '</div>'
    + '<div class="row" style="margin-top:10px">'
    +   '<button class="btn primary" id="pGen">确认，生成短文</button>'
    +   '<button class="btn ghost small" id="pClear">收起</button>'
    + '</div></div>';
  $$('[data-pterm]').forEach(el => el.addEventListener('input', () => {
    const i = Number(el.dataset.pterm);
    if (list[i]){
      list[i].term = el.value;
      list[i].type = /\s/.test(el.value.trim()) ? 'phrase' : 'word';
    }
    clearWordInput();
  }));
  $$('[data-pzh]').forEach(el => el.addEventListener('input', () => {
    const i = Number(el.dataset.pzh);
    if (list[i]) list[i].zhHint = el.value;
    clearWordInput();
  }));
  $$('[data-preading]').forEach(el => el.addEventListener('input', () => {
    const i = Number(el.dataset.preading);
    if (list[i]) list[i].reading = el.value;
    clearWordInput();
  }));
  $$('[data-pdel]').forEach(el => el.addEventListener('click', () => {
    list.splice(Number(el.dataset.pdel), 1);
    clearWordInput();
    if (!list.length){ state.draft.review = null; state.draft.reviewCollapsed = false; }
    renderPreview();
  }));
  $('#pAdd').addEventListener('click', () => {
    if (list.length >= 10){ toast('最多 10 个词'); return; }
    list.push({ term: '', reading: '', zhHint: '', type: 'word' });
    clearWordInput();
    renderPreview();
    const inputs = $$('[data-pterm]');
    const last = inputs[inputs.length - 1];
    if (last) last.focus();
  });
  $('#pClear').addEventListener('click', () => { state.draft.reviewCollapsed = true; renderPreview(); });
  $('#pGen').addEventListener('click', onGenerate);
}

function bindSetup(){
  const ab = $('#achBtn');
  if (ab) ab.addEventListener('click', showAchievement);
  const tipsClose = $('#tipsClose');
  if (tipsClose) tipsClose.addEventListener('click', () => {
    settings.tipsSeen = true;
    saveSettings();
    const card = $('#usageTips');
    if (card) card.remove();
  });
  const ta = $('#wordInput');
  ta.value = state.draft.words;
  updateWordCount();
  ta.addEventListener('input', () => {
    state.draft.words = ta.value;
    if (state.draft.review){ state.draft.review = null; state.draft.reviewCollapsed = false; renderPreview(); }
    updateWordCount();
  });
  $('#previewBtn').addEventListener('click', () => {
    const list = parseWords(ta.value).map(w => ({ term: w.term, reading: w.reading, zhHint: w.zhHint, type: w.type }));
    if (!list.length){ toast('没有识别到词或短语'); return; }
    state.draft.review = list;
    state.draft.reviewCollapsed = false;
    renderPreview();
    toast('已识别 ' + list.length + ' 条，可逐行修改');
  });
  renderPreview();

  $$('#langPills button').forEach(b => b.addEventListener('click', async () => {
    state.draft.lang = b.dataset.lang;
    settings.lang = b.dataset.lang; saveSettings();
    state.pickedOld = [];
    state.pool = await loadPool(b.dataset.lang);
    state.pickedOld = pickOld(state.pool, currentWords().map(w => bare(w.term)));
    renderToday();
    showInputTips(b.dataset.lang);
  }));
  $('#levelSel').addEventListener('change', e => { state.draft.level = e.target.value; settings.level = e.target.value; saveSettings(); });
  $('#poolOn').addEventListener('change', async e => {
    settings.poolOn = e.target.checked; saveSettings();
    state.pickedOld = e.target.checked ? pickOld(state.pool, currentWords().map(w => bare(w.term))) : [];
    renderToday();
  });
  $('#genBtn').addEventListener('click', onGenerate);
  $('#demoBtn').addEventListener('click', () => {
    enterSession(demoSession(state.draft.lang), false);
    renderToday();
  });
}

function pickOld(pool, excludeBare){
  if (!settings.poolOn) return [];
  return pool.filter(w => !excludeBare.includes(bare(w.term))).slice(0, 2);
}

let generating = false;
async function onGenerate(){
  if (generating) return;
  const words = currentWords();
  if (!words.length){ toast('先输入至少 1 个单词'); return; }
  if (!geminiKeyOk()){
    modal({
      title: '还没有填 Google 密钥',
      body: '<p>生成短文要调用一次免费的 AI 接口。你可以：</p>'
        + '<p class="small"><b>1.</b> 打开 aistudio.google.com，登录 Google 账号<br><b>2.</b> 点 Get API key，创建一个密钥并复制<br><b>3.</b> 回到这里，设置 → 粘贴 → 保存</p>'
        + '<p class="tiny">密钥只存在这台设备的浏览器里，不会上传到任何服务器。如果一个都不想填，可以先点「先用演示数据看流程」。</p>',
      actions: [{ label: '去设置', primary: true, onClick: () => showView('settings') }, { label: '先用演示' }]
    });
    return;
  }
  generating = true;
  const btn = $('#genBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 正在写…';
  const oldList = state.pickedOld.map(w => ({ term: w.term, zhHint: w.zh || '' }));
  const all = words.concat(oldList);
  try {
    const session = await generateSession(all, state.draft.level, state.draft.lang);
    session.words.forEach(w => { w.isNew = !oldList.some(o => bare(o.term) === bare(w.term) && (w.surface === w.term || w.surface)); });
    const fromNew = words.map(w => bare(w.term));
    session.words.forEach(w => { w.isNew = fromNew.includes(bare(w.term)); });
    if (state.pickedOld.length){
      state.pickedOld.forEach(o => { session.reviewTerms = session.reviewTerms || []; session.reviewTerms.push(o.term); });
    }
    enterSession(session, false);
    state.draft.review = null;
    state.draft.reviewCollapsed = false;
    await DB.put(session);
    state.history = await DB.all();
    renderToday();
    toast('短文已生成');
  } catch (e){
    showApiError(e, onGenerate);
  } finally {
    generating = false;
    if ($('#genBtn')){ const b = $('#genBtn'); b.disabled = false; b.textContent = '生成短文'; }
  }
}

function enterSession(s, unlocked, readOnly){

  state.readOnly = !!readOnly;
  state.reviewGap = null;
  state.readWordFilter = '';
  state.revealed = { retell: false, read: false };
  state.playing = false;
  state.playMode = null;
  state.playingMode = null;
  state.idx = -1;
  state.progress = 0;
  state.seekable = !(settings.ttsMode === 'cloud' && geminiKeyOk());
  loadNotes(s);
}
state.unlocked = false;
state.seekable = true;
state.revealed = { retell: false, read: false };
state.idx = -1;
state.progress = 0;

function bindSession(){
  const exit = $('#exitBtn');
  if (exit) exit.addEventListener('click', () => {

    modal({
      title: '放弃这一篇？', body: '<p>还没完成的话，这篇不会进入复习队列（但已经存档，可以在历史里找到）。</p>',

    });
  });

  if (ab) ab.addEventListener('click', showAchievement);

function closeSessionView(toHistory){
  stopAll();
  state.session = null;
  state.readOnly = false;
  state.reviewGap = null;
  state.step = 1;
  state.retellLevel = 0;

async function markReviewed(s, gap){
  if (!s) return;
  s.lastReviewedOn = todayStr();
  if (gap != null){
    s.reviewed = s.reviewed || [];
    if (s.reviewed.indexOf(gap) < 0) s.reviewed.push(gap);
  }
  await DB.put(s);
  state.history = await DB.all();
  toast(gap != null ? '已记为复习 ✓' : '已记录这次回听');
}

function renderSession(){
  const s = state.session;
  if (!s) return;
  renderRetellBody();
  renderReadBody();
  applyMask('retell');
  applyMask('read');
  const big = $('#listenBig'), bar = $('#playerBar'), below = $('#belowZone');

function bindBigPlayer(){
  const pb = $('#playBig');
  if (pb) pb.addEventListener('click', togglePlay);

  if (sk) sk.addEventListener('click', () => unlockSession(true));
  bindRate($('#rateBig'));

function bindBar(){
  const pb = $('#playBar');
  if (pb) pb.addEventListener('click', togglePlay);
  const prev = $('#prevSent'), next = $('#nextSent');
  if (prev) prev.addEventListener('click', () => jump(-1));
  if (next) next.addEventListener('click', () => jump(1));
  const bar = $('#pbar');
  if (bar) bar.addEventListener('click', e => {
    if (!state.seekable || !state.session) return;
    const r = bar.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    jumpTo(Math.floor(ratio * state.session.sentences.length));
  });
  bindRate($('#rateBar'));
}

function bindRate(el){
  if (!el) return;
  el.addEventListener('input', e => {
    const scope = el.dataset.scope === 'read' ? 'read' : 'listen';
    const v = Number(e.target.value);
    if (scope === 'read') settings.rateRead = v; else settings.rate = v;
    saveSettings();
    $$('.rateCtl').forEach(x => {
      if ((x.dataset.scope === 'read' ? 'read' : 'listen') === scope) x.value = String(v);
    });
    $$('.rateVal').forEach(x => {
      if ((x.dataset.scope === 'read' ? 'read' : 'listen') === scope) x.textContent = v.toFixed(2) + '×';
    });
    if (state.audioEl && (state.playMode === 'cloud' || state.playingMode)) state.audioEl.playbackRate = v;
    if (scope === 'listen' && state.playing && state.playMode === 'system') scheduleRateRestart();
    if (scope === 'read' && state.playingMode) scheduleReadRateRestart();
  });
}

let rateTimer = null;
function scheduleRateRestart(){
  clearTimeout(rateTimer);
  rateTimer = setTimeout(() => {
    if (!state.playing || state.playMode !== 'system' || state.idx < 0) return;
    const at = state.idx;
    state.playing = false;
    stopSpeech();
    systemPlay(at);
  }, 500);
}

let readRateTimer = null;
function scheduleReadRateRestart(){
  clearTimeout(readRateTimer);
  readRateTimer = setTimeout(() => {
    if (state.audioEl) return; // 云端音频可以直接改 playbackRate，不必重播
    const mode = state.playingMode;
    if (!mode) return;
    const at = state.readIdx >= 0 ? state.readIdx : 0;
    state.playingMode = null;
    stopSpeech();
    setCur(-1);
    if (mode === 'read') playReadAll(at); else readSentence(at);
  }, 400);
}

function applyMask(k){
  const body = k === 'retell' ? $('#retellBody') : $('#readBody');
  const mask = k === 'retell' ? $('#retellMask') : $('#readMask');
  if (!body) return;
  const on = !!state.revealed[k];
  body.classList.toggle('masked', !on);
  if (mask) mask.classList.toggle('hide', on);
}

function bindReveal(){
  ['retell', 'read'].forEach(k => {
    const mask = k === 'retell' ? $('#retellMask') : $('#readMask');
    if (!mask) return;
    const btn = mask.querySelector('[data-reveal]');
    if (btn) btn.addEventListener('click', () => revealBlock(k));
  });
}

function revealBlock(k){
  state.revealed[k] = true;
  if (state.session){
    state.session.done.retell = true;
    saveSession();
  }
  applyMask(k);
}

/* ============================ 记录板 ============================ */
const NB_MAX = 10;
function newNoteBlock(){
  return { id: state.nbIdSeq++, mode: 'text', text: '', strokes: [], tool: 'pen', height: 180 };
}
function loadNotes(s){
  if (s && Array.isArray(s.notes) && s.notes.length){
    state.notes = s.notes.map(b => ({
      id: b.id || state.nbIdSeq++, mode: b.mode || 'text',
      text: b.text || '', strokes: b.strokes || [], tool: b.tool || 'pen',
      height: Number(b.height) || 180
    }));
    state.nbIdSeq = Math.max(state.nbIdSeq, ...state.notes.map(b => b.id || 0)) + 1;
  } else {
    state.notes = [newNoteBlock()];
  }
  state.notesOpen = false;
}
function noteBlockById(id){ return state.notes.find(b => b.id === id); }
function noteHasContent(b){
  if (b.mode === 'text') return (b.text || '').trim().length > 0;
  return (b.strokes || []).length > 0;
}

function noteBlockHtml(b){
  const isText = b.mode === 'text';
  return ''

                  + '<button class="nb-tbtn ' + (b.tool === 'eraser' ? 'on' : '') + '" data-act="eraser">' + (b.tool === 'eraser' ? '橡皮擦(开)' : '橡皮擦') + '</button>'
                  + '<button class="nb-tbtn" data-act="clear">清空</button>'
                  + '<button class="nb-tbtn" data-act="full">全屏</button>')
  +     '<span class="spacer"></span>'
  +     '<button class="nb-del" data-act="del">删除板块</button>'
  +   '</div>'

        ? '<textarea class="nb-text" placeholder="随手记点什么…（不会自动保存）">' + esc(b.text) + '</textarea>'
        : '<canvas class="nb-canvas ' + (b.tool === 'eraser' ? 'eraser' : '') + '" style="height:' + (Number(b.height) || 180) + 'px"></canvas>'
          + '<div class="nb-resize" data-resize title="上下拖动调整高度"></div>')
  + '</div>';
}

function bindNoteBlock(b){
  const el = $('.nb-block[data-nbid="' + b.id + '"]');
  if (!el) return;
  el.querySelectorAll('.nb-mode button').forEach(btn => {
    btn.addEventListener('click', () => setNoteMode(b.id, btn.dataset.mode));
  });
  el.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'del') removeNoteBlock(b.id);
      else if (act === 'undo') undoNote(b.id);
      else if (act === 'clear') clearNote(b.id);
      else if (act === 'eraser'){ b.tool = (b.tool === 'eraser' ? 'pen' : 'eraser'); renderNotesBlocks(); }
      else if (act === 'full') openNoteFullscreen(b.id);
    });
  });
  const tx = el.querySelector('.nb-text');
  if (tx) tx.addEventListener('input', () => { b.text = tx.value; });
  const cv = el.querySelector('.nb-canvas');
  if (cv){
    setupNoteCanvas(cv, b); drawNoteBlock(b);
    const rz = el.querySelector('[data-resize]');
    if (rz) rz.addEventListener('pointerdown', e => {
      e.preventDefault();
      const startY = e.clientY, startH = Number(b.height) || 180;
      const move = ev => {
        b.height = Math.max(120, Math.min(720, startH + ev.clientY - startY));
        cv.style.height = b.height + 'px';
      };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }
}

function setNoteMode(id, mode){
  const b = noteBlockById(id); if (!b || b.mode === mode) return;
  b.mode = mode;
  renderNotesBlocks();
}
function addNoteBlock(){
  if (state.notes.length >= NB_MAX){ toast('最多 ' + NB_MAX + ' 个板块'); return; }
  state.notes.push(newNoteBlock());
  renderNotesBlocks();
}
function removeNoteBlock(id){
  state.notes = state.notes.filter(b => b.id !== id);
  if (!state.notes.length) state.notes.push(newNoteBlock());
  renderNotesBlocks();
}
function undoNote(id){
  const b = noteBlockById(id); if (!b || !b.strokes.length) return;
  b.strokes.pop();
  drawNoteBlock(b);
  renderNotesBlocks();
}
function clearNote(id){
  const b = noteBlockById(id); if (!b) return;
  b.strokes = [];
  drawNoteBlock(b);
  renderNotesBlocks();
}

function setupNoteCanvas(canvas, b, opts){
  const full = !!(opts && opts.full);
  const dpr = window.devicePixelRatio || 1;
  let scale = 1;
  const baseCanvas = () => $('.nb-block[data-nbid="' + b.id + '"] .nb-canvas');
  const fit = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    if (full){
      const baseW = baseCanvas() ? baseCanvas().clientWidth : 360;
      scale = w / Math.max(1, baseW);
    }
    paintNoteCanvas(canvas, b, scale);
  };
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);

  let drawing = false, current = null;
  const getPt = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    const p = getPt(e);
    if (b.tool === 'eraser'){
      b.strokes = b.strokes.filter(str => !str.points.some(pt => Math.hypot(pt.x - p.x, pt.y - p.y) <= 18 / scale));
      paintNoteCanvas(canvas, b, scale);
      if (!full) renderNotesBlocks();
      return;
    }
    drawing = true;
    current = { points: [p] };
    b.strokes.push(current);
    paintNoteCanvas(canvas, b, scale);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    e.preventDefault();
    const p = getPt(e);
    current.points.push(p);
    if (full && p.y > (Number(b.height) || 180) - 20){
      b.height = Math.max(Number(b.height) || 180, Math.min(720, Math.ceil(p.y + 20)));
      const base = baseCanvas();
      if (base) base.style.height = b.height + 'px';
    }
    paintNoteCanvas(canvas, b, scale);
  });
  const end = () => { if (!drawing) return; drawing = false; current = null; if (!full) renderNotesBlocks(); };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', end);
}

function paintNoteCanvas(cv, b, scale){
  if (!cv) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const dpr = window.devicePixelRatio || 1;
  const sc = scale || 1;
  ctx.save();
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.scale(dpr, dpr);
  ctx.scale(sc, sc);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 2.2 / sc;
  ctx.strokeStyle = '#111';
  ctx.fillStyle = '#111';
  b.strokes.forEach(str => {
    if (str.points.length < 2){
      const p = str.points[0];
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.1 / sc, 0, Math.PI * 2); ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(str.points[0].x, str.points[0].y);
    for (let i = 1; i < str.points.length; i++) ctx.lineTo(str.points[i].x, str.points[i].y);
    ctx.stroke();
  });
  ctx.restore();
}

function drawNoteBlock(b){
  const cv = $('.nb-block[data-nbid="' + b.id + '"] .nb-canvas');
  if (!cv) return;
  paintNoteCanvas(cv, b);
}

function openNoteFullscreen(id){
  const b = noteBlockById(id);
  if (!b) return;
  closeNoteFullscreen();
  state.noteFullId = id;
  const wrap = document.createElement('div');
  wrap.className = 'nb-fs';
  wrap.id = 'nbFs';
  wrap.innerHTML = '<div class="nb-fsbar">'
    + '<b style="font-size:13px">全屏记录板</b>'
    + '<button class="nb-tbtn" id="nbFsPlay">播放 / 暂停</button>'
    + '<span class="spacer"></span>'
    + '<button class="nb-tbtn" data-fs="undo">↶ 撤回</button>'
    + '<button class="nb-tbtn" data-fs="eraser">橡皮擦</button>'
    + '<button class="nb-tbtn" data-fs="clear">清空</button>'
    + '<button class="nb-tbtn" data-fs="exit">退出全屏</button>'
    + '</div><canvas id="nbFsCanvas"></canvas>'
    + '<div class="tiny" style="padding:6px 10px">写完点「退出全屏」，回到记录板点「保存」才会存入本会话。</div>';
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  const cv = $('#nbFsCanvas');
  setupNoteCanvas(cv, b, { full: true });
  paintNoteCanvas(cv, b);
  $('#nbFsPlay').addEventListener('click', () => { togglePlay(); });
  wrap.querySelectorAll('[data-fs]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.fs;
      if (act === 'exit'){ closeNoteFullscreen(); return; }
      if (act === 'undo') b.strokes.pop();

function exportNotesPNG(){
  const blocks = state.notes.filter(noteHasContent);
  if (!blocks.length){ toast('没有可导出的内容'); return; }
  const pad = 16, bw = 760, lineH = 26, padY = 16;
  const items = blocks.map(b => {
    if (b.mode === 'text'){
      const lines = wrapText(b.text, bw - pad * 2, '16px sans-serif');
      return { block: b, h: padY * 2 + Math.max(1, lines.length) * lineH, lines };
    } else {
      const strokes = b.strokes;
      const bb = bbox(strokes);
      const sw = bb.maxX - bb.minX, sh = bb.maxY - bb.minY;
      const scale = sw > (bw - pad * 2) ? (bw - pad * 2) / sw : 1;
      const dh = Math.max(90, sh * scale + padY * 2);
      return { block: b, strokes, h: dh, scale, ox: -bb.minX, oy: -bb.minY };
    }
  });
  const gap = 12;
  const totalH = items.reduce((a, it) => a + it.h, 0) + gap * (items.length - 1) + padY * 2;
  const cv = document.createElement('canvas');
  cv.width = bw; cv.height = Math.ceil(totalH);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  let y = padY;
  items.forEach(it => {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
    ctx.strokeRect(0.5, y + 0.5, bw - 1, it.h - 1);
    if (it.block.mode === 'text'){
      ctx.fillStyle = '#111'; ctx.font = '16px sans-serif'; ctx.textBaseline = 'top';
      it.lines.forEach((ln, j) => ctx.fillText(ln, pad, y + padY + j * lineH));
    } else {
      ctx.save();
      ctx.translate(pad, y + padY);
      ctx.scale(it.scale, it.scale);
      ctx.translate(it.ox, it.oy);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
      it.strokes.forEach(str => {
        if (str.points.length < 2){ const p = str.points[0]; ctx.beginPath(); ctx.arc(p.x, p.y, 1.1, 0, Math.PI * 2); ctx.fill(); return; }
        ctx.beginPath(); ctx.moveTo(str.points[0].x, str.points[0].y);
        for (let k = 1; k < str.points.length; k++) ctx.lineTo(str.points[k].x, str.points[k].y);
        ctx.stroke();
      });
      ctx.restore();
    }
    y += it.h + gap;
  });
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'learnwords-notes-' + (state.session && state.session.date || '') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('已导出 PNG');
  }, 'image/png');
}

function bbox(strokes){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  strokes.forEach(str => str.points.forEach(p => {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  }));
  if (!isFinite(minX)){ minX = 0; minY = 0; maxX = 0; maxY = 0; }
  return { minX, minY, maxX, maxY };
}
function wrapText(text, maxWidth, font){
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = font;
  const out = [];
  String(text).split('\n').forEach(para => {
    if (!para){ out.push(''); return; }
    let line = '';
    for (const ch of para){
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line){ out.push(line); line = ch; }
      else line = test;
    }
    if (line) out.push(line);
  });
  return out;
}

function printNotes(){
  const blocks = state.notes.filter(noteHasContent);

    + blocks.map(b => {

        }
        const cv = document.createElement('canvas');
        const strokes = b.strokes;
        const bb = bbox(strokes);
        const pad = 16;
        cv.width = Math.max(200, (bb.maxX - bb.minX) + pad * 2);
        cv.height = Math.max(80, (bb.maxY - bb.minY) + pad * 2);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.translate(pad - bb.minX, pad - bb.minY);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
        strokes.forEach(str => {
          if (str.points.length < 2){ const p = str.points[0]; ctx.beginPath(); ctx.arc(p.x, p.y, 1.1, 0, Math.PI * 2); ctx.fill(); return; }
          ctx.beginPath(); ctx.moveTo(str.points[0].x, str.points[0].y);
          for (let k = 1; k < str.points.length; k++) ctx.lineTo(str.points[k].x, str.points[k].y);
          ctx.stroke();
        });
        return '<div style="border:1px solid #000;margin-bottom:12px;background:#fff"><img src="' + cv.toDataURL('image/png') + '" style="display:block;width:100%"></div>';
      }).join('');
  setTimeout(() => {
    window.print();
    setTimeout(() => { pa.innerHTML = ''; }, 800);
  }, 120);
}

async function togglePlay(){
